# 프로덕션용 compose (#85) — dev(docker-compose.yml)와 분리
#  - Dockerfile의 prod stage 사용: non-editable install, --reload 없음
#  - credential은 반드시 환경에서 주입한다 (.env 파일 또는 셸 환경)
#  - db 포트를 호스트에 노출하지 않는다 (내부 네트워크 전용)
#  - 소스 볼륨 마운트 없음 — 코드는 이미지에 고정

services:
  db:
    image: postgres:16-alpine
    environment:
      # :? 는 미설정 시 즉시 실패 — 프로덕션에서 기본값(cii)을 허용하지 않는다
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER 미설정}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 미설정}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB 미설정}
      # DB_SCHEMA §0.1 [X-6]: 모든 TIMESTAMPTZ는 UTC 기준, 서버 timezone=UTC 설정 필수
      TZ: UTC
      PGTZ: UTC
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 5
  app:
    build:
      context: .
      target: prod
    # 이미지 이름을 명시한다 (#477) — 지정하지 않으면 개발용 compose와 같은 태그
    # (`26_hp043-app`)를 써서 서로를 덮어쓴다. 덮인 쪽은 오류 없이 다르게 동작한다.
    image: bluelog-app
    # crash 시 자동 재기동 — 단 명시적 stop에는 재기동 안 함 (#232).
    # `always`가 아닌 이유: deploy가 의도한 중지(by `docker compose down`)에도 뜨면 안 된다.
    restart: unless-stopped
    ports: ["8000:8000"]
    #
    # `.env`를 컨테이너에 주입한다 (#508). dev와 같은 이유이며, 운영에서 더 중요하다 —
    # `MAIL_BACKEND`가 비면 `mail/config.py`가 `console`로 떨어지고, 그 상태에서
    # 비밀번호 재설정 메일은 **로그로만 나간다.**
    #
    # `required: false` — CI의 docker 잡은 `.env` 없이 셸 환경변수만으로 이 스택을
    # 띄운다(`.github/workflows/ci.yml`). 파일을 필수로 두면 그 잡이 깨진다.
    #
    env_file:
      - path: .env
        required: false
    environment:
      # `environment:`가 `env_file:`보다 우선한다. `.env`의 `DATABASE_URL`은 호스트용
      # `localhost:5432`이므로 컨테이너 네트워크 주소로 덮어써야 한다.
      #
      # config.py 가드(#118) 발동용. Dockerfile prod stage의 ENV APP_ENV=production이
      # 이미지에 굳어 있어 compose에서 빼도 동작은 같지만, 가시성을 위해 명시한다 (#231).
      # APP_ENV 미설정 시 development로 떨어져 폴백이 일어날 수 있다는 경고 신호.
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
  # 프론트엔드 (#240) — nginx가 정적 자산을 서빙하고 /api를 app으로 리버스 프록시한다.
  # 같은 오리진이 되므로 apiProvider의 상대 경로 `/api/v1`이 그대로 성립하고
  # 백엔드에 CORS가 필요 없다 (vite.config.ts 주석의 판단을 유지).
  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        # ⚠️ Vite는 VITE_* 를 빌드 시점에 인라인한다 — 런타임 주입이 되지 않는다.
        # 값을 바꾸려면 이미지를 다시 구워야 한다 (frontend/Dockerfile 주석 참조).
        VITE_USE_API: ${VITE_USE_API:-true}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    ports: ["80:80"]
    depends_on:
      app:
        condition: service_started
volumes:
  pgdata: