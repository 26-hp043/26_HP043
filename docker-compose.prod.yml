# 프로덕션용 compose (#85 → #1058 CUBRID 전환)
#  - Dockerfile의 prod stage 사용: non-editable install, --reload 없음
#  - credential은 반드시 환경에서 주입한다 (.env 파일 또는 셸 환경)
#  - db 포트를 호스트에 노출하지 않는다 (내부 네트워크 전용)
#  - 소스 볼륨 마운트 없음 — 코드는 이미지에 고정

services:
  db:
    image: cubrid/cubrid:11.4
    platform: linux/amd64
    container_name: cii-cubrid
    hostname: cii-cubrid
    restart: unless-stopped
    environment:
      CUBRID_DB: ${CUBRID_DB:-cii}
    volumes: [cubrid-data:/var/lib/cubrid]
    healthcheck:
      test: ["CMD", "csql", "-u", "dba", "cii", "-c", "SELECT 1 FROM db_root"]
      interval: 30s
      timeout: 5s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
  app:
    build:
      context: .
      target: prod
    image: bluelog-app
    restart: unless-stopped
    expose: ["8000"]
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: cubrid+aiopycubrid://dba:${CUBRID_PASSWORD:-}@db:33000/${CUBRID_DB:-cii}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL 미설정}
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    ports: ["80:80"]
    depends_on:
      app:
        condition: service_started
volumes:
  cubrid-data:
