# docker-compose.prod.app.yml -- App 호스트 (app-01) OCI 분리 토폴로지.
#
# our-tax ADR-0005 패턴을 따른다. 이 스택은 app-01에서 실행되며,
# db-01의 CUBRID에 VCN 사설 네트워크로 접근한다.
#
# 사용법 (app-01):
#   cp .env.app.example .env
#   # .env 편집 (CUBRID_HOST, CUBRID_PASSWORD, CORS 등)
#   docker compose -f docker-compose.prod.app.yml up -d
#
# Alembic 마이그레이션 (릴리스마다 backend 교체 전 실행):
#   docker compose -f docker-compose.prod.app.yml --profile migrate \
#     run --rm migrate
#
# 규제 파라미터 seed (마이그레이션 후):
#   docker compose -f docker-compose.prod.app.yml --profile migrate \
#     run --rm migrate python -m cii_platform.db.seed
#
# CUBRID_HOST 기본값은 cubrid이므로 단일 호스트(docker-compose.prod.db.yml과 함께)에서도
# 동작한다. 프로덕션에서는 db-01 사설 IP를 설정한다.

# DATABASE_URL / DATABASE_SYNC_URL은 .env에서 주입한다. 비밀번호에 URL 예약 문자가
# 있을 수 있으므로 compose 인라인 조합 대신 완성된 URL을 넣는다 (#152 패턴).
x-cubrid-url: &cubrid-url
  "${DATABASE_URL:-cubrid+pycubrid://dba:${CUBRID_PASSWORD:-}@${CUBRID_HOST:-cubrid}:33100/cii}"

services:
  backend:
    # 프로덕션에서는 GHCR에서 풀한다 (deploy 워크플로가 설정).
    # 로컬 검증 시 build context로 폴백한다.
    image: ${BACKEND_IMAGE:-ghcr.io/26-hp043/bluelog-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: cii-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: *cubrid-url
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      # 메일
      MAIL_BACKEND: ${MAIL_BACKEND:-console}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      # ⚠️ 기본값을 **여기에** 둔다 (#1331). `${SMTP_PORT:-}`이면 `.env`에 값이 없을 때
      # compose가 빈 문자열을 넘기고, 앱은 **키가 있는 것으로 보아** 587 기본값을 쓰지
      # 않는다 — `int("")`로 기동이 실패한다(`mail/config.py`도 빈 값을 미설정으로 접지만
      # 두 곳 모두에서 막는다).
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      # 가입 게이트
      SIGNUP_ALLOWED_DOMAINS: ${SIGNUP_ALLOWED_DOMAINS:-}
      SIGNUP_INVITE_CODE: ${SIGNUP_INVITE_CODE:-}
      # 둘러보기 접근 코드 (#1486). **비면 둘러보기가 닫힌다**(fail-closed) —
      # 가입 게이트와 반대 방향이라 미설정이 곧 안전한 상태다.
      TOUR_ACCESS_CODE: ${TOUR_ACCESS_CODE:-}
      # 코드 없이 둘러보기를 여는 스위치 (#1486 후속). 문만 넓어지고 권한은 그대로다 —
      # 둘러보기 세션은 `auth/tour_policy.py`가 읽기 전용으로 묶는다.
      TOUR_PUBLIC: ${TOUR_PUBLIC:-}
      # 최초 관리자 (#672 · #1301) — 여기 든 이메일은 가입·로그인할 때마다 관리자로 맞춰진다.
      #
      # **이 줄이 없으면 `.env`에 적어도 컨테이너에 닿지 않는다 (#1290).** 이 서비스에는
      # `env_file:`이 없고 아래 `environment:` 목록만 주입되기 때문이다 — compose가 `.env`를
      # 읽는 것은 `${VAR}` 치환용이지 컨테이너 주입이 아니다(`#508`이 `MAIL_BACKEND`에서
      # 겪은 것과 같은 함정). 그 상태에서는 새 DB가 **관리자 0명**으로 뜨고, 승격 경로도
      # 관리자 전용이라 화면으로는 아무도 풀 수 없다.
      INITIAL_ADMIN_EMAILS: ${INITIAL_ADMIN_EMAILS:-}
      # ⚠️ 옛 이름도 **넘긴다** — 넘기지 않으면 app-01 `.env`에 옛 이름만 남아 있을 때 앱이
      # 그 사실을 볼 수 없어, 기동 거부(`role_bootstrap.LEGACY_ENV_NAME`) 대신 관리자 0명으로
      # **조용히** 뜬다(`APP_ENV=staging`이면 필수 검사도 없다). 거부는 값이 있을 때만이라
      # 비어 있으면 아무 일도 없다 (#1301 · 독립 검토 지적).
      INITIAL_OFFICE_EMAILS: ${INITIAL_OFFICE_EMAILS:-}
      # 요청 한도
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      RATE_LIMIT_CALC_PER_MINUTE: ${RATE_LIMIT_CALC_PER_MINUTE:-60}
      RATE_LIMIT_CHAT_PER_MINUTE: ${RATE_LIMIT_CHAT_PER_MINUTE:-10}
      # 챗봇
      LLM_API_KEY: ${LLM_API_KEY:-}
      # 비우면 Anthropic 기본값 (#1535)
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_AUTH_SCHEME: ${LLM_AUTH_SCHEME:-}
      # 공공데이터 재항 기록 수집 (#1197). 비우면 수집 경로만 꺼진다
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
      # 프록시
      USE_FORWARDED_FOR: ${USE_FORWARDED_FOR:-false}
      # 프록시 서명 헤더의 비밀 값 (#1483). 비면 서명 헤더를 무시하고 종전 규칙으로 센다.
      # **이 줄이 없으면 `.env`에 있어도 컨테이너에 닿지 않는다**(위 `INITIAL_ADMIN_EMAILS` 주석).
      PROXY_CLIENT_IP_SECRET: ${PROXY_CLIENT_IP_SECRET:-}
      # #827 ⑵ 구조화 로그 — JSON 한 줄·회전(10MB×5). 장애 대응은 이 파일을 본다
      # (docs/OPERATIONS.md §8.2.1). 볼륨에 남으므로 컨테이너를 다시 만들어도 유지된다.
      # `docker-compose.prod.yml`(단일 호스트)에만 있어, **분리 토폴로지에서는 문서대로
      # grep하면 「No such file」이었다** (#1331).
      LOG_FILE: /app/logs/api.jsonl
    volumes:
      - app-logs:/app/logs
    ports:
      # ourtax-backend가 8000을 사용하므로 8001로 배정한다.
      - "8001:8000"
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  # 일회성 Alembic 마이그레이션. 기본 스택에 포함되지 않으며
  # deploy 워크플로가 이미지 교체 전 실행한다.
  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/26-hp043/bluelog-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: cii-migrate
    restart: "no"
    profiles:
      - migrate
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: *cubrid-url
    command: ["alembic", "upgrade", "head"]
    # 배포 중에만 뜨는 컨테이너에도 상한을 준다 (#1911).
    #
    # `backend`(512M)·`cloudflared`(128M)에는 있는데 여기에만 없었다. 이 컨테이너는
    # **backend가 떠 있는 상태에서** 얹히므로, 1GB VM에 두 프로젝트가 사는 이 호스트에서
    # 상한 없는 세 번째 파이썬 프로세스가 배포 때마다 여유를 잠식했다. 2026-09-25에
    # 스왑이 0이던 app-01이 그 자리에서 **호스트째 멈췄다**(`#1911`).
    #
    # 값은 `backend`와 같게 둔다 — 같은 이미지에서 같은 SQLAlchemy 스택을 올리므로
    # 알려진 프로필이 그것이다. 모자라면 **배포가 소리 내며 실패한다**(컨테이너가
    # OOM으로 죽는다). 상한이 없을 때처럼 호스트가 조용히 멈추는 것보다 낫다.
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel (#1496)
  # ---------------------------------------------------------------------------
  #
  # ## 왜 필요한가
  #
  # Pages Function 프록시(`#1322`)가 백엔드를 **IP 주소**로 불렀는데, Cloudflare 공식
  # 문서가 *「Workers 서브리퀘스트는 URL로만 보낼 수 있고 IP로는 보낼 수 없다」*로
  # 적는다. 실측에서도 `error code: 1003`(Direct IP access not allowed)이 났다.
  #
  # 터널은 **아웃바운드 연결**이라 호스트명을 주면서 동시에 인바운드 포트를 열지 않는다
  # — `:8001` 직접 노출(`#786`)과 프록시 뒤 요청 한도(`#1483`)도 같은 걸음에 닫힌다.
  #
  # ## 프로필 뒤에 둔다
  #
  # 토큰이 없으면 `cloudflared`는 뜨자마자 죽고 `restart: unless-stopped`가 재시작
  # 루프를 만든다. `migrate`와 같은 방식으로 **프로필 뒤에 두어**, 배포가 토큰이 있을
  # 때만 올린다.
  #
  # ⚠️ **토큰을 `command:`에 싣지 않는다** — `docker ps`·`ps aux`에 그대로 보인다.
  # `cloudflared`는 `TUNNEL_TOKEN` 환경변수를 읽는다.
  cloudflared:
    image: cloudflare/cloudflared:2026.8.1
    container_name: cii-cloudflared
    restart: unless-stopped
    profiles:
      - tunnel
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: ["tunnel", "--no-autoupdate", "run"]
    networks:
      # 같은 네트워크에 있어야 터널이 `http://backend:8000`으로 닿는다. 공개 호스트명과
      # 그 주소의 연결은 **Cloudflare 대시보드**에서 정한다(저장소에 두지 않는다).
      - app-net
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  # 구조화 로그 (#827 ⑵ · #1331). 컨테이너를 다시 만들어도 남아야 사후 추적이 된다.
  app-logs:

networks:
  app-net:
    name: cii-app-net
