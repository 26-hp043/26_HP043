# docker-compose.prod.app.yml -- App 호스트 (app-01) OCI 분리 토폴로지.
#
# our-tax ADR-0005 패턴을 따른다. 이 스택은 app-01에서 실행되며,
# db-01의 CUBRID에 VCN 사설 네트워크로 접근한다.
#
# 사용법 (app-01):
#   cp .env.app.example .env
#   # .env 편집 (CUBRID_HOST, CUBRID_PASSWORD, CORS 등)
#   docker compose -f docker-compose.prod.app.yml up -d
#
# Alembic 마이그레이션 (릴리스마다 backend 교체 전 실행):
#   docker compose -f docker-compose.prod.app.yml --profile migrate \
#     run --rm migrate
#
# 규제 파라미터 seed (마이그레이션 후):
#   docker compose -f docker-compose.prod.app.yml --profile migrate \
#     run --rm migrate python -m cii_platform.db.seed
#
# CUBRID_HOST 기본값은 cubrid이므로 단일 호스트(docker-compose.prod.db.yml과 함께)에서도
# 동작한다. 프로덕션에서는 db-01 사설 IP를 설정한다.

# DATABASE_URL / DATABASE_SYNC_URL은 .env에서 주입한다. 비밀번호에 URL 예약 문자가
# 있을 수 있으므로 compose 인라인 조합 대신 완성된 URL을 넣는다 (#152 패턴).
x-cubrid-url: &cubrid-url
  "${DATABASE_URL:-cubrid+aiopycubrid://dba:${CUBRID_PASSWORD:-}@${CUBRID_HOST:-cubrid}:33100/cii}"

services:
  backend:
    # 프로덕션에서는 GHCR에서 풀한다 (deploy 워크플로가 설정).
    # 로컬 검증 시 build context로 폴백한다.
    image: ${BACKEND_IMAGE:-ghcr.io/26-hp043/bluelog-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: cii-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: *cubrid-url
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      # 메일
      MAIL_BACKEND: ${MAIL_BACKEND:-console}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      # 가입 게이트
      SIGNUP_ALLOWED_DOMAINS: ${SIGNUP_ALLOWED_DOMAINS:-}
      SIGNUP_INVITE_CODE: ${SIGNUP_INVITE_CODE:-}
      # 요청 한도
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-300}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
      RATE_LIMIT_CALC_PER_MINUTE: ${RATE_LIMIT_CALC_PER_MINUTE:-60}
      RATE_LIMIT_CHAT_PER_MINUTE: ${RATE_LIMIT_CHAT_PER_MINUTE:-10}
      # 챗봇
      LLM_API_KEY: ${LLM_API_KEY:-}
      # 프록시
      USE_FORWARDED_FOR: ${USE_FORWARDED_FOR:-false}
    ports:
      # ourtax-backend가 8000을 사용하므로 8001로 배정한다.
      - "8001:8000"
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  # 일회성 Alembic 마이그레이션. 기본 스택에 포함되지 않으며
  # deploy 워크플로가 이미지 교체 전 실행한다.
  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/26-hp043/bluelog-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: cii-migrate
    restart: "no"
    profiles:
      - migrate
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: *cubrid-url
    command: ["alembic", "upgrade", "head"]

networks:
  app-net:
    name: cii-app-net
