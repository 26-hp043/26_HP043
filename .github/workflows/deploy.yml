# OCI 배포 (분리 토폴로지: db-01 + app-01)
#
# our-tax deploy.yml 패턴을 따른다:
#   1. backend 이미지를 GHCR에 빌드·푸시 (linux/amd64).
#   2. SSH db-01: git pull, CUBRID 스택 기동 (멱등).
#   3. SSH app-01: git pull, .env 렌더, GHCR pull, Alembic 마이그레이션,
#      backend 재시작 (IP-only 모드, 포트 8001).
#   4. /api/v1/health 헬스 체크.
#   5. 프론트엔드: npm build → wrangler pages deploy (Cloudflare Pages · #1236).
#      백엔드 잡과 독립이다 — OCI 자격증명이 비어 있어도 화면 배포는 시도한다.
#
# 필요한 시크릿 (Settings -> Secrets and variables -> Actions):
#
#   OCI_SSH_PRIVATE_KEY   PEM 형식 개인키 (패스프레이즈 없음).
#   OCI_SSH_USER          SSH 사용자 (보통 ubuntu).
#   OCI_DB_HOST           db-01 SSH 접근 주소 (공용 IP).
#   OCI_APP_HOST          app-01 SSH 접근 주소 (공용 IP).
#   OCI_DB_PRIVATE_IP     db-01 VCN 사설 IP (app-01이 CUBRID에 접속).
#   OCI_APP_PRIVATE_IP    app-01 VCN 사설 IP (CUBRID broker ACL에 치환).
#   CUBRID_PASSWORD       dba 비밀번호. 양쪽 호스트 동일.
#   CORS_ALLOW_ORIGINS    프론트엔드 오리진 (쉼표 구분).
#   APP_PUBLIC_URL        메일 링크 기준 주소 (프론트엔드 공개 URL).
#   INITIAL_ADMIN_EMAILS  최초 관리자 이메일(쉼표 구분). **선택이 아니다** — 비면 관리자
#                         0명으로 뜨고 화면으로는 아무도 역할을 올릴 수 없다 (#672 · #1301).
#                         APP_ENV=production이면 기동이 거부되고, staging이면 조용히 뜬다.
#
# 프론트엔드 배포 시크릿 (#1236):
#   CLOUDFLARE_API_TOKEN    Cloudflare API 토큰 (Pages:Edit 권한).
#   CLOUDFLARE_ACCOUNT_ID   Cloudflare 계정 ID.
#
# 선택 시크릿:
#   APP_ENV                 배포 환경. 비워 두면 staging (SMTP 미설정 정상 경로 ·
#                           docs/OPERATIONS.md §4.5). SMTP_* 를 등록한 뒤
#                           production 으로 바꾼다.
#   SIGNUP_ALLOWED_DOMAINS  가입 허용 메일 도메인.
#   SIGNUP_INVITE_CODE      초대 코드.
#   TOUR_ACCESS_CODE        둘러보기 링크의 접근 코드 (#1486). 비우면 둘러보기가 닫힌다.
#   CLOUDFLARE_TUNNEL_TOKEN Cloudflare Tunnel 커넥터 토큰 (#1496).
#                           🔴 현재 운영은 이 값을 **비워 둔다(의도)** — 커넥터는 app-01의
#                           systemd cloudflared가 이미 제공하며 ourtax와 공유한다
#                           (docs/OPERATIONS.md §3.5). 등록하면 compose가 커넥터를 하나 더
#                           띄워 같은 터널에 둘이 붙는다. 아래 "CLOUDFLARE_TUNNEL_TOKEN
#                           미설정" 경고는 그래서 정상이며 고칠 대상이 아니다.
#   API_ORIGIN              Pages Function이 백엔드를 부를 **호스트명** (#1496).
#                           ⚠️ **IP를 넣으면 안 된다** — Workers는 IP로 fetch할 수 없다
#                           (실측 `error code: 1003`). 터널이 준 호스트명을 넣는다.
#   MAIL_FROM / SMTP_HOST / SMTP_PORT / SMTP_USER / SMTP_PASSWORD
#                           MAIL_BACKEND 기본값은 console 이다 — SMTP_* 를
#                           등록할 때 MAIL_BACKEND=smtp 도 함께 넣는다.
#   LLM_API_KEY             챗봇 LLM API 키.

name: Deploy to OCI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'alembic/**'
      - 'alembic.ini'
      - 'pyproject.toml'
      - 'Dockerfile'
      - 'docker-compose.prod.*.yml'
      - 'ops/**'
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      force_db_init:
        description: "DESTRUCTIVE: cubrid-data 볼륨을 삭제하고 재초기화. 데이터 손실 비가역적."
        type: boolean
        default: false
      seed_demo:
        description: "데모 데이터(선박 5척·항차 33건)를 적재한다. 시연·인터뷰 직전에 켠다 (#1485)."
        type: boolean
        default: false
      clear_demo:
        description: "적재 전에 기존 데모 데이터를 지운다. seed_demo와 함께 켜면 「지우고 새로 넣기」 (#1485)."
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/bluelog-backend

jobs:
  # ---------------------------------------------------------------------------
  # 필수 시크릿 프리플라이트 (#1234)
  # ---------------------------------------------------------------------------
  # deploy-db가 CUBRID_PASSWORD 하나만 보다가 비어 있으면 죽었다 — 하나 고칠 때마다
  # 다음 것이 또 비는지 확인하는 루프였다(실측: 시크릿 0건 상태로 5연속 실패).
  # 여기서 9종을 한 번에 보고 **이름만** 출력한다. 값은 절대 출력하지 않는다.
  # ---------------------------------------------------------------------------
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 필수 시크릿 점검 (이름만 출력)
        env:
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          OCI_SSH_USER: ${{ secrets.OCI_SSH_USER }}
          OCI_DB_HOST: ${{ secrets.OCI_DB_HOST }}
          OCI_APP_HOST: ${{ secrets.OCI_APP_HOST }}
          OCI_DB_PRIVATE_IP: ${{ secrets.OCI_DB_PRIVATE_IP }}
          OCI_APP_PRIVATE_IP: ${{ secrets.OCI_APP_PRIVATE_IP }}
          CUBRID_PASSWORD: ${{ secrets.CUBRID_PASSWORD }}
          CORS_ALLOW_ORIGINS: ${{ secrets.CORS_ALLOW_ORIGINS }}
          APP_PUBLIC_URL: ${{ secrets.APP_PUBLIC_URL }}
        run: |
          missing=0
          for name in \
            OCI_SSH_PRIVATE_KEY OCI_SSH_USER OCI_DB_HOST OCI_APP_HOST \
            OCI_DB_PRIVATE_IP OCI_APP_PRIVATE_IP CUBRID_PASSWORD \
            CORS_ALLOW_ORIGINS APP_PUBLIC_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::시크릿 ${name} 가 비어 있다"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "::error::위 시크릿을 Settings → Secrets and variables → Actions 에서 등록한다 (docs/OPERATIONS.md §3.1 · #1234)"
            exit 1
          fi
          echo "[preflight] 필수 시크릿 9종 확인"

  # ---------------------------------------------------------------------------
  # 이미지 빌드 & GHCR 푸시
  # ---------------------------------------------------------------------------
  build:
    needs: preflight
    runs-on: ubuntu-latest
    # 멈춤이 6시간이 되지 않게 한다 (#533 — 한 잡이 5시간 59분을 태웠고, 기본 상한이
    # 6시간이라 자동으로 실패하지도 않아 알림조차 오지 않았다).
    # linux/amd64 이미지 빌드 + GHCR 푸시. 정상 소요는 5분 안쪽이다.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          sha="${GITHUB_SHA::12}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "[build] image: ${BACKEND_IMAGE}:${sha}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: prod
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Summary
        run: |
          echo "::notice title=Build complete::backend image pushed at sha=${{ steps.meta.outputs.sha }}"

  # ---------------------------------------------------------------------------
  # db-01: CUBRID 스택 기동 (멱등)
  # ---------------------------------------------------------------------------
  deploy-db:
    runs-on: ubuntu-latest
    # SSH + compose 기동 + CUBRID healthcheck 대기 (#533). CUBRID 기동이 느려
    # 넉넉히 두되, 한 시간을 넘기면 그것은 기다림이 아니라 멈춤이다.
    timeout-minutes: 20
    needs: build
    steps:
      - name: CUBRID_PASSWORD 길이 검증 (CUBRID 11.4 <= 31바이트)
        env:
          CUBRID_PASSWORD: ${{ secrets.CUBRID_PASSWORD }}
        run: |
          if [ -z "${CUBRID_PASSWORD}" ]; then
            echo "::error::CUBRID_PASSWORD 시크릿이 비어 있다"
            exit 1
          fi
          len=$(printf '%s' "${CUBRID_PASSWORD}" | wc -c)
          if [ "${len}" -gt 31 ]; then
            echo "::error::CUBRID_PASSWORD가 ${len}바이트다. CUBRID 11.4 한도는 31바이트."
            exit 1
          fi

      - name: SSH 설정
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.OCI_SSH_PRIVATE_KEY }}" > ~/.ssh/id_oci
          chmod 600 ~/.ssh/id_oci
          ssh-keyscan -H ${{ secrets.OCI_DB_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: db-01 스택 적용
        env:
          CUBRID_PASSWORD: ${{ secrets.CUBRID_PASSWORD }}
          OCI_APP_PRIVATE_IP: ${{ secrets.OCI_APP_PRIVATE_IP }}
          FORCE_DB_INIT: ${{ inputs.force_db_init }}
        run: |
          echo "[deploy-db] === START $(date -u +%FT%TZ) host=${{ secrets.OCI_DB_HOST }} ==="
          ssh -i ~/.ssh/id_oci ${{ secrets.OCI_SSH_USER }}@${{ secrets.OCI_DB_HOST }} \
            "CUBRID_PASSWORD='${CUBRID_PASSWORD}' OCI_APP_PRIVATE_IP='${OCI_APP_PRIVATE_IP}' FORCE_DB_INIT='${FORCE_DB_INIT}' GH_REPO='${{ github.repository }}' GH_TOKEN='${{ secrets.GITHUB_TOKEN }}' bash -s" <<'ENDSSH'
          set -euo pipefail
          echo "[db-01] connected at $(date -u +%FT%TZ); host=$(hostname)"

          # 레포 클론 또는 업데이트
          if [ ! -d ~/bluelog ]; then
            git clone "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" ~/bluelog
          fi
          cd ~/bluelog
          git fetch "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" main
          git reset --hard FETCH_HEAD

          # ACL 템플릿 치환
          sed -i "s/REPLACE_ME_APP_PRIVATE_IP/${OCI_APP_PRIVATE_IP}/g" \
            ops/cubrid/conf/broker_access.conf \
            ops/cubrid/conf/server_access.conf

          # .env 렌더링
          umask 077
          cat > .env <<EOF
          CUBRID_PASSWORD=${CUBRID_PASSWORD}
          EOF

          # force_db_init: 볼륨 파괴 후 재초기화
          if [ "${FORCE_DB_INIT}" = "true" ]; then
            echo "::warning::force_db_init=true -- cubrid-data 볼륨 파괴"
            docker compose -f docker-compose.prod.db.yml down -v </dev/null || true
          fi

          docker compose -f docker-compose.prod.db.yml pull </dev/null
          docker compose -f docker-compose.prod.db.yml up -d </dev/null

          # CUBRID 브로커 대기
          ready=""
          echo "[db-01] CUBRID 브로커 대기 (최대 60회 x 2초 = 120초)"
          for i in $(seq 1 60); do
            if docker compose -f docker-compose.prod.db.yml exec -T cubrid \
                 csql -u dba -p "${CUBRID_PASSWORD}" cii -c 'SELECT 1 FROM db_root' </dev/null >/dev/null 2>&1; then
              ready="with-password"
              echo "[db-01] 브로커 준비 완료 (비밀번호 인증, ${i}회차)"
              break
            fi
            if docker compose -f docker-compose.prod.db.yml exec -T cubrid \
                 csql -u dba cii -c 'SELECT 1 FROM db_root' </dev/null >/dev/null 2>&1; then
              ready="no-password"
              echo "[db-01] 브로커 준비 완료 (비밀번호 없음, ${i}회차)"
              break
            fi
            [ $((i % 10)) -eq 0 ] && echo "[db-01] 대기 중 (${i}/60)"
            sleep 2
          done

          if [ -z "${ready}" ]; then
            echo "CUBRID 준비 실패" >&2
            docker compose -f docker-compose.prod.db.yml logs --tail=80 cubrid </dev/null >&2
            exit 1
          fi

          # 첫 부트: dba 비밀번호 설정
          if [ "${ready}" = "no-password" ]; then
            echo "[db-01] dba 비밀번호 설정 중..."
            docker compose -f docker-compose.prod.db.yml exec -T cubrid \
              csql -u dba cii -c "ALTER USER dba PASSWORD '${CUBRID_PASSWORD}';" </dev/null >/dev/null
            # CAS 워커 캐시 갱신을 위해 컨테이너 재시작
            docker compose -f docker-compose.prod.db.yml restart cubrid </dev/null >/dev/null
            # 재시작 후 대기
            for i in $(seq 1 60); do
              if docker compose -f docker-compose.prod.db.yml exec -T cubrid \
                   csql -u dba -p "${CUBRID_PASSWORD}" cii -c 'SELECT 1 FROM db_root' </dev/null >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done
            # 검증
            if ! docker compose -f docker-compose.prod.db.yml exec -T cubrid \
                 csql -u dba -p "${CUBRID_PASSWORD}" cii -c 'SELECT 1 FROM db_root' </dev/null >/dev/null 2>&1; then
              echo "dba 비밀번호 적용 실패" >&2
              exit 1
            fi
            echo "[db-01] dba 비밀번호 적용 완료"
          fi
          echo "[db-01] === END $(date -u +%FT%TZ) ==="
          ENDSSH

  # ---------------------------------------------------------------------------
  # app-01: 이미지 풀, 마이그레이션, backend 재시작
  # ---------------------------------------------------------------------------
  deploy-app:
    runs-on: ubuntu-latest
    # SSH + .env 렌더 + GHCR pull + Alembic + 재시작 + 헬스 체크 (#533).
    timeout-minutes: 20
    needs: [build, deploy-db]
    steps:
      - name: SSH 설정
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.OCI_SSH_PRIVATE_KEY }}" > ~/.ssh/id_oci
          chmod 600 ~/.ssh/id_oci
          ssh-keyscan -H ${{ secrets.OCI_APP_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: app-01 스택 배포
        env:
          BACKEND_TAG: ${{ needs.build.outputs.sha }}
          APP_ENV: ${{ secrets.APP_ENV || 'staging' }}
          CUBRID_HOST: ${{ secrets.OCI_DB_PRIVATE_IP }}
          CUBRID_PASSWORD: ${{ secrets.CUBRID_PASSWORD }}
          CORS_ALLOW_ORIGINS: ${{ secrets.CORS_ALLOW_ORIGINS }}
          APP_PUBLIC_URL: ${{ secrets.APP_PUBLIC_URL }}
          SIGNUP_ALLOWED_DOMAINS: ${{ secrets.SIGNUP_ALLOWED_DOMAINS }}
          SIGNUP_INVITE_CODE: ${{ secrets.SIGNUP_INVITE_CODE }}
          INITIAL_ADMIN_EMAILS: ${{ secrets.INITIAL_ADMIN_EMAILS }}
          TOUR_ACCESS_CODE: ${{ secrets.TOUR_ACCESS_CODE }}
          TOUR_PUBLIC: ${{ secrets.TOUR_PUBLIC }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          MAIL_BACKEND: ${{ secrets.MAIL_BACKEND }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # 데모 데이터 적재·초기화 (#1485). push 트리거에는 `inputs`가 없어 빈 문자열이
          # 되므로 **자동 배포에서는 켜지지 않는다** — 아래 셸이 `= "true"`로만 본다.
          SEED_DEMO: ${{ inputs.seed_demo }}
          CLEAR_DEMO: ${{ inputs.clear_demo }}
        run: |
          echo "[deploy-app] === START $(date -u +%FT%TZ) host=${{ secrets.OCI_APP_HOST }} sha=${BACKEND_TAG} ==="
          ssh -i ~/.ssh/id_oci ${{ secrets.OCI_SSH_USER }}@${{ secrets.OCI_APP_HOST }} \
            "BACKEND_TAG='${BACKEND_TAG}' \
             APP_ENV='${APP_ENV}' \
             SEED_DEMO='${SEED_DEMO:-false}' CLEAR_DEMO='${CLEAR_DEMO:-false}' \
             CUBRID_HOST='${CUBRID_HOST}' CUBRID_PASSWORD='${CUBRID_PASSWORD}' \
             CORS_ALLOW_ORIGINS='${CORS_ALLOW_ORIGINS:-}' \
             APP_PUBLIC_URL='${APP_PUBLIC_URL:-}' \
             SIGNUP_ALLOWED_DOMAINS='${SIGNUP_ALLOWED_DOMAINS:-}' \
             SIGNUP_INVITE_CODE='${SIGNUP_INVITE_CODE:-}' \
             INITIAL_ADMIN_EMAILS='${INITIAL_ADMIN_EMAILS:-}' \
             TOUR_ACCESS_CODE='${TOUR_ACCESS_CODE:-}' \
             TOUR_PUBLIC='${TOUR_PUBLIC:-}' \
             CLOUDFLARE_TUNNEL_TOKEN='${CLOUDFLARE_TUNNEL_TOKEN:-}' \
             MAIL_BACKEND='${MAIL_BACKEND:-console}' \
             MAIL_FROM='${MAIL_FROM:-}' \
             SMTP_HOST='${SMTP_HOST:-}' SMTP_PORT='${SMTP_PORT:-587}' \
             SMTP_USER='${SMTP_USER:-}' SMTP_PASSWORD='${SMTP_PASSWORD:-}' \
             SMTP_USE_TLS='${SMTP_USE_TLS:-true}' \
             LLM_API_KEY='${LLM_API_KEY:-}' \
             GHCR_USER='${{ github.actor }}' GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
             GH_REPO='${{ github.repository }}' GH_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
             bash -s" <<'ENDSSH'
          set -euo pipefail
          echo "[app-01] connected at $(date -u +%FT%TZ); deploying sha=${BACKEND_TAG}"

          # 레포 클론 또는 업데이트
          if [ ! -d ~/bluelog ]; then
            git clone "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" ~/bluelog
          fi
          cd ~/bluelog
          git fetch "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" main
          git reset --hard FETCH_HEAD

          # CUBRID_PASSWORD URL 인코딩 (SQLAlchemy 호환)
          CUBRID_PASSWORD_ENC=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "${CUBRID_PASSWORD}")

          # .env 렌더링
          umask 077
          cat > .env <<EOF
          APP_ENV=${APP_ENV}
          CUBRID_HOST=${CUBRID_HOST}
          CUBRID_PASSWORD=${CUBRID_PASSWORD}
          DATABASE_URL=cubrid+pycubrid://dba:${CUBRID_PASSWORD_ENC}@${CUBRID_HOST}:33100/cii
          CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS}
          APP_PUBLIC_URL=${APP_PUBLIC_URL}
          SIGNUP_ALLOWED_DOMAINS=${SIGNUP_ALLOWED_DOMAINS}
          SIGNUP_INVITE_CODE=${SIGNUP_INVITE_CODE}
          INITIAL_ADMIN_EMAILS=${INITIAL_ADMIN_EMAILS}
          SMTP_USE_TLS=${SMTP_USE_TLS}
          TOUR_ACCESS_CODE=${TOUR_ACCESS_CODE}
          TOUR_PUBLIC=${TOUR_PUBLIC}
          CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
          MAIL_BACKEND=${MAIL_BACKEND}
          MAIL_FROM=${MAIL_FROM}
          SMTP_HOST=${SMTP_HOST}
          SMTP_PORT=${SMTP_PORT}
          SMTP_USER=${SMTP_USER}
          SMTP_PASSWORD=${SMTP_PASSWORD}
          LLM_API_KEY=${LLM_API_KEY}
          BACKEND_IMAGE=ghcr.io/${{ github.repository_owner }}/bluelog-backend:${BACKEND_TAG}
          EOF

          # GHCR 로그인
          echo "[app-01] GHCR 로그인 (${GHCR_USER})"
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          echo "[app-01] backend 이미지 풀 (${BACKEND_TAG})"
          docker compose -f docker-compose.prod.app.yml pull backend </dev/null

          # Alembic 마이그레이션
          echo "[app-01] alembic upgrade head"
          docker compose -f docker-compose.prod.app.yml --profile migrate run --rm -T migrate </dev/null

          # 규제 파라미터 seed
          echo "[app-01] 규제 파라미터 seed"
          docker compose -f docker-compose.prod.app.yml --profile migrate \
            run --rm -T migrate python -m cii_platform.db.seed </dev/null

          # 데모 데이터 (#1485) — **수동 트리거로만 돈다.**
          #
          # 매 배포마다 돌리지 않는 이유는 `db/demo_seed.py` 머리주석이 적는다 —
          # 「이 모듈의 데이터는 시연·개발 편의이며 운영 데이터가 아니다. 그래서
          # 마이그레이션 체인에 넣지 않고 필요할 때만 부른다」. 조건을 지우면
          # `tests/test_deploy_demo_seed.py`가 빨개진다.
          #
          # 적재는 덮어쓰지 않으므로(IntegrityError를 삼킨다) 시각을 새로 잡으려면
          # clear_demo를 함께 켠다. 시드 시각이 **적재일 기준 상대값**이라(`#792`)
          # 오래된 적재는 진행 중 항차가 도착 예정을 넘긴 상태로 보인다.
          if [ "${CLEAR_DEMO}" = "true" ]; then
            echo "::warning::clear_demo=true -- 데모 데이터를 지운다 (계산 이력이 참조하는 행은 남는다)"
            docker compose -f docker-compose.prod.app.yml --profile migrate \
              run --rm -T migrate python -m cii_platform.db.demo_seed --clear </dev/null
          fi
          if [ "${SEED_DEMO}" = "true" ]; then
            echo "[app-01] 데모 데이터 seed"
            docker compose -f docker-compose.prod.app.yml --profile migrate \
              run --rm -T migrate python -m cii_platform.db.demo_seed </dev/null
          fi

          # Cloudflare Tunnel (#1496) — **토큰이 있을 때만.**
          #
          # 토큰이 없으면 `cloudflared`가 뜨자마자 죽고 재시작 루프가 된다. 프로필 뒤에
          # 두고 여기서 조건으로 올린다(`migrate`와 같은 방식).
          if [ -n "${CLOUDFLARE_TUNNEL_TOKEN}" ]; then
            echo "[app-01] cloudflared 시작"
            docker compose -f docker-compose.prod.app.yml --profile tunnel up -d cloudflared </dev/null
          else
            echo "::warning::CLOUDFLARE_TUNNEL_TOKEN 미설정 — 터널을 띄우지 않는다 (#1496)"
          fi

          # Backend 시작
          echo "[app-01] backend 컨테이너 시작"
          docker compose -f docker-compose.prod.app.yml up -d backend </dev/null
          docker compose -f docker-compose.prod.app.yml ps backend </dev/null || true
          echo "[app-01] === END $(date -u +%FT%TZ) ==="
          ENDSSH

      - name: 헬스 체크
        run: |
          url="http://${{ secrets.OCI_APP_HOST }}:8001/api/v1/health"
          echo "[health] ${url} 확인 (최대 30회 x 5초 = 150초)"
          for i in $(seq 1 30); do
            body=$(curl -fsS --max-time 5 "${url}" 2>&1) && {
              echo "[health] OK (${i}회차) body=${body}"
              echo "::notice title=Deploy complete::backend healthy at sha=${{ needs.build.outputs.sha }}"
              exit 0
            }
            echo "[health] ${i}/30 실패; 5초 후 재시도"
            sleep 5
          done
          echo "::error title=Deploy failed::backend가 30회 시도 후에도 healthy하지 않다" >&2
          exit 1

  # ---------------------------------------------------------------------------
  # 프론트엔드: Cloudflare Pages 배포 (#1236)
  # ---------------------------------------------------------------------------
  # 백엔드 잡과 **독립**이다 — needs를 붙이지 않는다. OCI 시크릿이 비어 있어도
  # 화면 배포는 시도해야 한다(두 시스템의 자격증명은 서로 별개다).
  # Node 버전은 package.json engines과 같은 값 — 동기 대상 4곳 문서 참조.
  # ---------------------------------------------------------------------------
  deploy-frontend:
    runs-on: ubuntu-latest
    # 빌드+업로드 정상 소요 1~2분 (#533 — 멈춤 상한).
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Cloudflare 자격증명 점검 (이름만 출력)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::시크릿 ${name} 가 비어 있다"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "::error::위 시크릿을 Settings → Secrets and variables → Actions 에서 등록한다 (docs/OPERATIONS.md §3.2 · #1236)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # VITE_API_BASE_URL은 빌드 시점에 코드에 굳는다 — 그래서 **상대 경로**를 굳힌다 (#1322).
      #
      # 종전에는 `http://131.186.22.10:8001/api/v1`이었고, 그 절대 주소가 세 겹을
      # 만들었다 — https 페이지의 http 호출(혼합 콘텐츠 차단) · `Secure` 쿠키가 http
      # 응답에서 거부됨 · `SameSite=Lax` 쿠키가 교차 사이트 fetch에 실리지 않음.
      # **클라우드에서 로그인이 아예 성립하지 않았다.**
      #
      # 이제 화면은 자기 오리진(`https://bluelog-bx7.pages.dev/api/v1/…`)만 부르고,
      # `functions/api/[[path]].ts`가 백엔드로 넘긴다. 세 겹이 함께 사라지고
      # 백엔드·`API_SPEC §1.2`는 그대로다.
      #
      # ⚠️ **절대 주소로 되돌리지 않는다.** `tests/test_deploy_frontend_origin.py`가 막는다.
      - run: npm run build
        env:
          VITE_API_BASE_URL: /api/v1
          # 불리언 하나다 — **접근 코드는 번들에 넣지 않는다**(`VITE_`는 빌드 산출물에
          # 그대로 인라인된다). 코드 없는 둘러보기를 실제로 허용할지는 서버의
          # `TOUR_PUBLIC`이 판정하며, 이 값은 버튼을 보일지만 정한다 (#1486 후속).
          VITE_TOUR_PUBLIC: ${{ secrets.TOUR_PUBLIC }}

      # `API_ORIGIN`을 시크릿에서 렌더한다 (#1496).
      #
      # ## 왜 저장소에 두지 않는가
      #
      # 종전에는 `wrangler.toml`에 `http://131.186.22.10:8001`이 박혀 있었다. **그 IP가
      # 결함의 원인이었고**(Workers는 IP로 fetch할 수 없다 · 실측 `error 1003`), 터널이
      # 주는 호스트명은 터널을 만들 때 정해지므로 **커밋 시점에 알 수 없다.**
      #
      # ⚠️ 미설정이면 **배포를 멈춘다.** 자리표시자가 그대로 올라가면 프록시가 조용히
      # 실패하고, 증상은 종전과 똑같은 「로그인이 안 된다」라 구분되지 않는다.
      - name: wrangler.toml의 API_ORIGIN 렌더
        env:
          API_ORIGIN: ${{ secrets.API_ORIGIN }}
        run: |
          if [ -z "${API_ORIGIN}" ]; then
            echo "::error::시크릿 API_ORIGIN 이 비어 있다 — Pages Function이 백엔드를 찾지 못한다 (#1496)"
            exit 1
          fi
          case "${API_ORIGIN}" in
            *[0-9].[0-9]*[0-9].[0-9]*[0-9].[0-9]*)
              echo "::error::API_ORIGIN 이 IP 주소로 보인다 — Workers는 IP로 fetch할 수 없다 (#1496)"
              exit 1
              ;;
          esac
          python3 - "${API_ORIGIN}" <<'PY'
          import pathlib, re, sys
          p = pathlib.Path("wrangler.toml")
          t = p.read_text(encoding="utf-8")
          t2 = re.sub(r'^API_ORIGIN\s*=.*$', f'API_ORIGIN = "{sys.argv[1]}"', t, count=1, flags=re.M)
          assert t2 != t, "wrangler.toml에 API_ORIGIN 줄이 없다"
          p.write_text(t2, encoding="utf-8")
          PY
          grep -n '^API_ORIGIN' wrangler.toml

      - name: wrangler pages deploy (프로덕션)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # 출력 디렉터리(`dist`)와 프로젝트 이름은 `frontend/wrangler.toml`이 갖는다 (#1322).
        # 그 파일이 `functions/`의 `API_ORIGIN`도 함께 들고 있어, 배포 대상과 프록시
        # 상류가 **한 파일에** 적힌다. 위치 인자로 `dist`를 다시 주면 wrangler가
        # `pages_build_output_dir`와 충돌한다고 거부한다.
        run: npx --yes wrangler@4 pages deploy --branch main

      - name: Summary
        run: |
          echo "::notice title=Frontend deployed::https://bluelog-bx7.pages.dev (sha=${GITHUB_SHA::12})"
