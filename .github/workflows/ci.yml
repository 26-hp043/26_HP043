name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.2
      - run: ruff check src/ alembic/ tests/ scripts/
      - run: ruff format --check src/ alembic/ tests/ scripts/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cii
          POSTGRES_PASSWORD: cii
          POSTGRES_DB: cii_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      # 리포트 PDF 렌더링 (#361) — WeasyPrint 런타임 + 한국어 폰트.
      # 넣지 않으면 PDF 테스트가 조용히 건너뛰어지고, **한글이 tofu로 나오는 회귀를
      # CI가 잡지 못한다.** 이 이슈의 완료 기준이 「PDF에 한글이 깨지지 않는 것」이다.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 fonts-nanum
      - run: pip install -e ".[dev]"
      # 커버리지 게이트 (#235): 측정 기준선 92%(2026-08-14, 2171 stmts)에서
      # 2pp 버퍼를 둔 90%. 작은 무커버 추가에 흔들리지 않으면서 큰 하락은 잡는다.
      - run: pytest --cov=cii_platform --cov-report=xml --cov-report=term-missing --cov-fail-under=90
        env:
          DATABASE_URL: postgresql://cii:cii@localhost:5432/cii_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # node-version은 frontend/package.json의 engines를 그대로 따른다.
      # react-router 8.3.0이 ">=22.22.0"을 요구하며, 이 저장소에는 .npmrc가 없어
      # engine-strict가 꺼져 있다 — npm이 engines를 강제하지 않으므로 낮은 Node에서
      # 설치는 통과하고 런타임·빌드에서 늦게 깨진다. CI에서 버전을 고정해 그 경로를 막는다.
      - uses: actions/setup-node@v7
        with:
          # frontend/package.json의 engines와 같은 값을 쓴다.
          # ⚠️ engines를 올릴 때 세 곳(package.json · 이 파일 · audit.yml)을 함께
          # 올려야 한다 — 자동 동기화가 없다. package.json은 JSON이라 주석을 달 수 없어
          # 이 경고를 두 워크플로에만 둔다.
          node-version: "22.22.0"
          # ~/.npm(다운로드 캐시)만 캐시된다. node_modules는 npm ci가 매번 새로 만든다.
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # oxlint — react/rules-of-hooks 등 tsc가 못 잡는 규칙 보완(#177).
      # 경고 0건 · 실행 <1초(0.16초). #133의 기간 보류(8/8 데모 전)가 소멸해 게이트로 추가.
      - run: npm run lint
      # tsc -b(타입 검사) + vite build. 별도 typecheck 스텝을 두지 않는 이유다.
      - run: npm run build
      # vitest run — watch 모드가 아니다(package.json scripts 확인함).
      - run: npm run test

  # 배포 산출물 검증 (#393).
  #
  # 위 세 잡은 Docker를 전혀 다루지 않는다. 그래서 #240이 만든 frontend/Dockerfile ·
  # nginx.conf · docker-compose.prod.yml과 #127이 만든 마이그레이션 적재 경로가
  # **어느 잡의 검사 범위에도 들어가지 않았다.** CI green이 배포 동작의 증명이 아니었다.
  #
  # 실제로 #240 검증 중 `docker compose run`이 5주 전 이미지를 조용히 재사용해
  # `No 'script_location' key found`로 실패한 일이 있었다. 로그에 낡은 이미지를
  # 쓴다는 표시가 없어 사람이 직접 돌려봐야만 드러나는 종류였다.
  #
  # paths 필터를 두지 않는 이유 — #127이 seed를 `alembic upgrade head`에 편입해
  # `alembic/` 변경이 곧 배포 내용 변경이다. 안전하게 좁히려면 Dockerfile ·
  # frontend/ · docker-compose* · alembic/ · src/ · pyproject.toml을 다 넣어야 하고,
  # 그러면 항상 실행과 차이가 거의 없다.
  #
  # 인증은 검증하지 않는다 — APP_ENV=production에서는 스텁 인증 라우트가 등록되지
  # 않아(#276) 계산 API가 401을 낸다. 자격증명을 CI에 넣지 않는다(#395 소관).
  # 이 잡의 범위는 「화면이 뜨고 API가 프록시를 통해 응답한다」까지다.
  docker:
    runs-on: ubuntu-latest
    env:
      # compose가 `${VAR:?}`로 미설정 시 즉시 실패시킨다(#85). CI 전용 값이며
      # 이 스택은 잡이 끝나면 사라진다.
      POSTGRES_USER: cii
      POSTGRES_PASSWORD: ci-docker-job
      POSTGRES_DB: cii
      COMPOSE: docker compose -f docker-compose.prod.yml
    steps:
      - uses: actions/checkout@v7

      # build를 별도 단계로 두는 이유 — `docker compose run`은 같은 이름의 이미지가
      # 있으면 다시 굽지 않는다. 러너는 매번 깨끗하지만, README 배포 절차와 같은
      # 순서를 밟아야 절차 자체가 유효한지 확인된다.
      - name: 이미지 빌드 (app · frontend)
        run: $COMPOSE build

      - name: DB 기동 + healthcheck 대기
        run: |
          $COMPOSE up -d db
          for i in $(seq 1 30); do
            if $COMPOSE exec -T db pg_isready -U "$POSTGRES_USER" >/dev/null 2>&1; then
              echo "db ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::db healthcheck 타임아웃"; exit 1

      # 스키마 + 규제 파라미터가 이 한 명령으로 들어가는 것이 #127의 완료 기준이다.
      - name: 마이그레이션 (스키마 + seed)
        run: $COMPOSE run --rm app alembic upgrade head

      # 적재 행 수는 PRD §3.4.1(8) · §3.4.3(20) · §3.4.4(14)와 fuel_type 8행이다.
      # 개수를 고정하지 않으면 「마이그레이션은 돌았지만 아무것도 안 넣은」 상태를
      # 통과시킨다 — #240에서 seed 명령이 조용히 no-op이던 것이 그 사례다.
      - name: 규제 파라미터 적재 확인 (50행)
        run: |
          set -e
          check() {
            actual=$($COMPOSE exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "SELECT count(*) FROM $1")
            actual=$(echo "$actual" | tr -d '[:space:]')
            if [ "$actual" != "$2" ]; then
              echo "::error::$1 = $actual (기대 $2)"; exit 1
            fi
            echo "  $1 = $actual"
          }
          check regulation_year 8
          check cii_reference_line 20
          check cii_rating_boundary 14
          check fuel_type 8

      - name: 앱 + 화면 기동
        run: $COMPOSE up -d

      # nginx·uvicorn이 응답하기까지 몇 초가 걸린다. 재시도로 흡수하되
      # 무한정 기다리지 않는다.
      - name: HTTP 검증 (화면 · 프록시 · SPA fallback)
        run: |
          set -e
          probe() {
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$1" || true)
              if [ "$code" = "200" ]; then echo "  $1 → 200"; return 0; fi
              sleep 2
            done
            echo "::error::$1 → $code (기대 200)"; return 1
          }
          # 정적 자산
          probe http://localhost/
          # nginx가 /api를 app:8000으로 넘기는가 — 같은 오리진 구성의 핵심 (#240)
          probe http://localhost/api/v1/health
          # SPA fallback — 클라이언트 라우터 경로가 404가 되면 안 된다 (#348)
          probe http://localhost/vessels/x

      # 실패 원인을 로그 없이 추측하지 않도록 남긴다.
      - name: 실패 시 컨테이너 로그
        if: failure()
        run: |
          $COMPOSE ps
          $COMPOSE logs --tail=120

      - name: 정리
        if: always()
        run: $COMPOSE down -v
