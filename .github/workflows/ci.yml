name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.20
      - run: ruff check src/ alembic/ tests/ scripts/
      - run: ruff format --check src/ alembic/ tests/ scripts/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cii
          POSTGRES_PASSWORD: cii
          POSTGRES_DB: cii_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - run: pip install -e ".[dev]"
      - run: pytest --cov=cii_platform --cov-report=xml --cov-report=term-missing
        env:
          DATABASE_URL: postgresql://cii:cii@localhost:5432/cii_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # node-version은 frontend/package.json의 engines를 그대로 따른다.
      # react-router 8.3.0이 ">=22.22.0"을 요구하며, 이 저장소에는 .npmrc가 없어
      # engine-strict가 꺼져 있다 — npm이 engines를 강제하지 않으므로 낮은 Node에서
      # 설치는 통과하고 런타임·빌드에서 늦게 깨진다. CI에서 버전을 고정해 그 경로를 막는다.
      - uses: actions/setup-node@v4
        with:
          # frontend/package.json의 engines와 같은 값을 쓴다.
          # ⚠️ engines를 올릴 때 세 곳(package.json · 이 파일 · audit.yml)을 함께
          # 올려야 한다 — 자동 동기화가 없다. package.json은 JSON이라 주석을 달 수 없어
          # 이 경고를 두 워크플로에만 둔다.
          node-version: "22.22.0"
          # ~/.npm(다운로드 캐시)만 캐시된다. node_modules는 npm ci가 매번 새로 만든다.
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # oxlint — react/rules-of-hooks 등 tsc가 못 잡는 규칙 보완(#177).
      # 경고 0건 · 실행 <1초(0.16초). #133의 기간 보류(8/8 데모 전)가 소멸해 게이트로 추가.
      - run: npm run lint
      # tsc -b(타입 검사) + vite build. 별도 typecheck 스텝을 두지 않는 이유다.
      - run: npm run build
      # vitest run — watch 모드가 아니다(package.json scripts 확인함).
      - run: npm run test
