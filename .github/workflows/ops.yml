# 운영 작업 (#788 · #789 · #1635) — 서버에서 돌려야 하는 일을 버튼 하나로
#
# 서버 SSH 키는 GitHub 시크릿(`OCI_SSH_PRIVATE_KEY`)에만 있다. 로컬에는 없고, 사람이 서버에
# 들어가 명령을 치는 경로가 없다. 그래서 백업·수집·롤백 실습·복구 리허설처럼 **서버에서만
# 할 수 있는 일**을 이 워크플로의 수동 실행(Actions → Ops → Run workflow)으로 모은다.
# 저장소 쓰기 권한이 있는 사람은 누구나 돌릴 수 있다.
#
# 작업(task)
#
#   inspect         읽기만 한다. db-01 마운트·볼륨·디스크·백업 목록·테이블별 행 수 ·
#                   app-01 이미지·헬스·포트. 다른 작업 앞뒤로 상태를 남기는 데 쓴다.
#   backup          db-01에서 `scripts/db_backup.py backup` (덤프 + 검증 + 감사 기록).
#                   덤프는 db-01의 `~/bluelog/backups/`에 남는다(호스트 밖으로 옮기지 않는다).
#   rehearse        가장 최근 덤프(또는 `dump`)를 새 DB에 복구해 대조한 뒤 지운다. 운영 DB는
#                   건드리지 않는다.
#   collect         app-01에서 공적 재항 기록을 한 번 수집한다(#1197 · 실패가 있으면 exit 1).
#   rollback-drill  app-01 백엔드를 `image_sha` 이미지로 바꿔 헬스 commit을 확인하고, 잠시
#                   뒤 **원래 이미지로 되돌린다**(OPERATIONS §3.6.2 · #789). 실패해도
#                   되돌린다(trap). 두 커밋 사이에 마이그레이션 변경이 있으면 시작하지 않는다.
#   restore         백업 → 리허설 → 앱 정지 → 복구 교체 → 앱 기동 → 헬스
#                   (OPERATIONS §3.6.6 · #1635). 서비스가 잠시 멈춘다. `confirm`에 `cii`.
#                   교체는 **방금 뜨고 리허설한 바로 그 덤프**로 한다.
#   app-start       app-01 백엔드를 켜고 헬스를 본다 — 교체가 되돌려져 앱이 꺼진 채 남았을 때.
#
# ⚠️ 이 저장소는 **공개**다. Actions 로그와 아티팩트를 누구나 본다. 그래서 덤프는
# `BACKUP_ARTIFACT_PASSPHRASE`로 **암호화한 파일만** 올리고, 시크릿이 없으면 올리지 않는다
# (#788 정정 결정 A · 09-26).
#
# 원격 스크립트는 `bash -s`로 stdin에서 읽힌다. 그 안의 docker·python이 stdin을 읽으면 남은
# 스크립트를 삼키므로 `</dev/null`을 붙인다(deploy.yml과 같은 이유).
#
# 배포와 같은 concurrency 그룹을 쓴다 — 배포 도중에 백업·교체가 끼지 않게 한다.

name: Ops

on:
  workflow_dispatch:
    inputs:
      task:
        description: "작업"
        type: choice
        options: [inspect, backup, rehearse, collect, rollback-drill, restore, app-start]
        default: inspect
      image_sha:
        description: "rollback-drill: 잠시 띄울 이전 이미지 커밋 (12자리)"
        type: string
        default: ""
      dump:
        description: "rehearse: 덤프 파일 이름 (비우면 가장 최근 것)"
        type: string
        default: ""
      confirm:
        description: "restore: 운영 DB 이름 `cii`를 적어야 시작한다"
        type: string
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  ops:
    runs-on: ubuntu-latest
    # `shell: bash`를 명시해야 `-eo pipefail`이 된다 — 기본(`bash -e`)은 `ssh … | tee`의
    # 실패를 tee의 성공으로 덮는다(Fable 검토 · PR #1945).
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    env:
      TASK: ${{ inputs.task }}
      SSH_USER: ${{ secrets.OCI_SSH_USER }}
      DB_HOST: ${{ secrets.OCI_DB_HOST }}
      APP_HOST: ${{ secrets.OCI_APP_HOST }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # rollback-drill이 두 커밋의 alembic/ 차이를 본다
          fetch-depth: 0

      - name: 입력 검증
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
          CONFIRM: ${{ inputs.confirm }}
          DUMP: ${{ inputs.dump }}
        run: |
          if [ "${TASK}" = "rollback-drill" ] && ! printf '%s' "${IMAGE_SHA}" | grep -Eq '^[0-9a-f]{12}$'; then
            echo "::error::rollback-drill에는 image_sha(커밋 12자리)가 필요하다"
            exit 1
          fi
          if [ "${TASK}" = "restore" ] && [ "${CONFIRM}" != "cii" ]; then
            echo "::error::restore는 confirm에 운영 DB 이름 cii를 적어야 시작한다"
            exit 1
          fi
          # 덤프 이름은 원격 셸에 들어간다 — 파일 이름 모양만 받는다
          if [ -n "${DUMP}" ] && [ "${TASK}" != "rehearse" ]; then
            echo "::error::dump 입력은 rehearse 전용이다 — restore는 방금 뜨고 리허설한 덤프로만 교체한다"
            exit 1
          fi
          if [ -n "${DUMP}" ] && ! printf '%s' "${DUMP}" | grep -Eq '^[A-Za-z0-9._-]+\.dump$'; then
            echo "::error::dump는 backups/ 안의 파일 이름(*.dump)만 받는다"
            exit 1
          fi

      - name: SSH 설정
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.OCI_SSH_PRIVATE_KEY }}" > ~/.ssh/id_oci
          chmod 600 ~/.ssh/id_oci
          # 호스트 키는 실행 중에 받지 않는다 (#1637 · OPERATIONS §4.7)
          for h in "${DB_HOST}" "${APP_HOST}"; do
            if ! ssh-keygen -F "${h}" -f ops/host/known_hosts >/dev/null; then
              echo "::error::ops/host/known_hosts 에 호스트 키가 없다 — docs/OPERATIONS.md §4.7"
              exit 1
            fi
          done
          cp ops/host/known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # ------------------------------------------------------------------
      # inspect — 읽기만
      # ------------------------------------------------------------------
      - name: 상태 보기 (db-01)
        if: inputs.task == 'inspect' || inputs.task == 'backup' || inputs.task == 'restore'
        run: |
          ssh -i ~/.ssh/id_oci -o StrictHostKeyChecking=yes "${SSH_USER}@${DB_HOST}" bash -s <<'ENDSSH'
          set -euo pipefail
          cd ~/bluelog
          echo "[db-01] 저장소 $(git log -1 --format='%h %s')"
          echo "[db-01] cii-cubrid 마운트 (#1867 — cubrid-data가 데이터 경로에 붙어 있어야 한다)"
          docker inspect -f '{{range .Mounts}}{{.Type}} {{.Name}} -> {{.Destination}}{{println}}{{end}}' cii-cubrid </dev/null
          echo "[db-01] 볼륨"
          docker volume ls </dev/null
          echo "[db-01] 디스크"
          df -h / /var/lib/docker 2>/dev/null || df -h /
          docker exec cii-cubrid sh -c 'du -sh "$CUBRID_DATABASES"' </dev/null || true
          echo "[db-01] 백업"
          ls -la backups/ 2>/dev/null || echo "(backups/ 없음)"
          echo "[db-01] 테이블별 행 수 · 트리거 수"
          COMPOSE="docker compose -f docker-compose.prod.db.yml" python3 - <<'PY'
          import os, shlex, sys
          sys.path.insert(0, "scripts")
          import db_backup as b
          db = b.Db(shlex.split(os.environ["COMPOSE"]), service="cubrid")
          for name, count in sorted(db.counts().items()):
              print(f"  {name}={count}")
          print(f"  triggers={db.trigger_count()}")
          PY
          ENDSSH

      - name: 상태 보기 (app-01)
        if: inputs.task == 'inspect'
        run: |
          ssh -i ~/.ssh/id_oci -o StrictHostKeyChecking=yes "${SSH_USER}@${APP_HOST}" bash -s <<'ENDSSH'
          set -euo pipefail
          cd ~/bluelog
          echo "[app-01] 저장소 $(git log -1 --format='%h %s')"
          grep '^BACKEND_IMAGE=' .env
          docker compose -f docker-compose.prod.app.yml ps </dev/null
          echo "[app-01] 백엔드 포트 게시 (#786)"
          docker compose -f docker-compose.prod.app.yml port backend 8000 </dev/null || true
          echo "[app-01] 헬스"
          curl -fsS --max-time 5 http://127.0.0.1:8001/api/v1/health || echo "[app-01] 헬스 응답 없음"
          echo
          ENDSSH

      # ------------------------------------------------------------------
      # backup · rehearse — db-01
      # ------------------------------------------------------------------
      - name: 백업 (db-01)
        id: backup
        if: inputs.task == 'backup' || inputs.task == 'restore'
        run: |
          ssh -i ~/.ssh/id_oci -o StrictHostKeyChecking=yes "${SSH_USER}@${DB_HOST}" bash -s <<'ENDSSH' | tee "${RUNNER_TEMP}/backup.log"
          set -euo pipefail
          cd ~/bluelog
          export COMPOSE="docker compose -f docker-compose.prod.db.yml" DB_SERVICE=cubrid APP_SERVICE=none
          python3 scripts/db_backup.py backup </dev/null
          echo "[db-01] LATEST_DUMP=$(ls -t backups/*.dump | head -1)"
          ENDSSH
          dump="$(sed -n 's/^\[db-01\] LATEST_DUMP=//p' "${RUNNER_TEMP}/backup.log" | tail -1)"
          if ! printf '%s' "${dump}" | grep -Eq '^backups/[A-Za-z0-9._-]+\.dump$'; then
            echo "::error::덤프 경로를 읽지 못했다: ${dump:-없음}"
            exit 1
          fi
          echo "dump=${dump}" >> "$GITHUB_OUTPUT"

      # 호스트 밖 보관 (#788 결정 ① · 정정 결정 A) — 서버를 잃어도 백업이 남게 Actions
      # 아티팩트로도 올린다. ⚠️ 저장소가 **공개**라 아티팩트는 누구나 내려받는다. 덤프에는 가입자
      # 이메일·비밀번호 해시가 담기므로 **러너에서 암호화한 파일만** 올리고, 평문은 올리기 전에
      # 지운다. 암호 시크릿이 없으면 받지도 올리지도 않는다(서버 안 백업만 남는다).
      # 푸는 법: `openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in X.enc -out X` (OPERATIONS §3.8).
      - name: 덤프 받기 · 암호화 (db-01 → 러너)
        id: encrypt
        if: steps.backup.outcome == 'success'
        env:
          DUMP: ${{ steps.backup.outputs.dump }}
          PASSPHRASE: ${{ secrets.BACKUP_ARTIFACT_PASSPHRASE }}
        run: |
          if [ -z "${PASSPHRASE}" ]; then
            echo "::notice::BACKUP_ARTIFACT_PASSPHRASE가 없다 — 아티팩트를 올리지 않는다(서버 안 백업만) · #788"
            echo "encrypted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          plain="${RUNNER_TEMP}/db-backup-plain"
          out="${RUNNER_TEMP}/db-backup"
          mkdir -p "${plain}" "${out}"
          base="${DUMP%.dump}"
          scp -i ~/.ssh/id_oci -o StrictHostKeyChecking=yes \
            "${SSH_USER}@${DB_HOST}:bluelog/${DUMP}" "${SSH_USER}@${DB_HOST}:bluelog/${base}.json" \
            "${plain}/"
          for f in "${plain}"/*; do
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
              -pass env:PASSPHRASE -in "${f}" -out "${out}/$(basename "${f}").enc"
          done
          rm -rf "${plain}"
          ls -la "${out}"
          echo "encrypted=true" >> "$GITHUB_OUTPUT"

      - name: 덤프 올리기 (암호화 파일만 · Actions 아티팩트 · 14일)
        if: steps.encrypt.outputs.encrypted == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/db-backup/*.enc
          retention-days: 14
          if-no-files-found: error

      - name: 복구 리허설 (db-01)
        if: inputs.task == 'rehearse' || inputs.task == 'restore'
        env:
          DUMP: ${{ inputs.dump }}
          # restore는 방금 뜬 덤프로 리허설하고, 같은 파일로 교체한다(Fable 검토 · PR #1945)
          RESTORE_DUMP: ${{ steps.backup.outputs.dump }}
        run: |
          ssh -i ~/.ssh/id_oci -o StrictHostKeyChecking=yes "${SSH_USER}@${DB_HOST}" "DUMP='${DUMP}' RESTORE_DUMP='${RESTORE_DUMP}' bash -s" <<'ENDSSH'
          set -euo pipefail
          cd ~/bluelog
          export COMPOSE="docker compose -f docker-compose.prod.db.yml" DB_SERVICE=cubrid APP_SERVICE=none
          if [ -n "${RESTORE_DUMP}" ]; then f="${RESTORE_DUMP}"
          elif [ -n "${DUMP}" ]; then f="backups/${DUMP}"
          else f="$(ls -t backups/*.dump | head -1)"; fi
          echo "[db-01] 리허설 대상 ${f}"
          python3 scripts/db_backup.py rehearse "${f}" </dev/null
          ENDSSH

      # ------------------------------------------------------------------
      # restore — 앱 정지 → 교체 → 앱 기동 (OPERATIONS §3.6.6)
      # ------------------------------------------------------------------
      - name: 앱 정지 (app-01)
        if: inputs.task == 'restore'
        run: |
          ssh -i ~/.ssh/id_oci -o StrictHostKeyChecking=yes "${SSH_USER}@${APP_HOST}" bash -s <<'ENDSSH'
          set -euo pipefail
          cd ~/bluelog
          docker compose -f docker-compose.prod.app.yml stop backend </dev/null
          ENDSSH

      - name: 복구 교체 (db-01)
        id: swap
        if: inputs.task == 'restore'
        env:
          RESTORE_DUMP: ${{ steps.backup.outputs.dump }}
        run: |
          ssh -i ~/.ssh/id_oci -o StrictHostKeyChecking=yes "${SSH_USER}@${DB_HOST}" "RESTORE_DUMP='${RESTORE_DUMP}' bash -s" <<'ENDSSH'
          set -euo pipefail
          cd ~/bluelog
          export COMPOSE="docker compose -f docker-compose.prod.db.yml" DB_SERVICE=cubrid APP_SERVICE=none
          f="${RESTORE_DUMP}"
          echo "[db-01] 복구 교체 ${f}"
          python3 scripts/db_backup.py restore "${f}" --confirm cii --app-stopped </dev/null
          ENDSSH

      # 교체가 실패하면 앱을 켜지 않는다 — 스크립트가 「앱을 켜지 않았습니다」로 멈춘 경우
      # 수동 복구가 먼저다(OPERATIONS §3.6.6). restore에서는 swap 성공 때만 돈다.
      # 스크립트가 운영 DB를 제 이름으로 되돌리고 끝난 경우에는 `app-start`로 따로 켠다.
      - name: 앱 기동 · 헬스 (app-01)
        if: (inputs.task == 'restore' && steps.swap.outcome == 'success') || inputs.task == 'app-start'
        run: |
          ssh -i ~/.ssh/id_oci -o StrictHostKeyChecking=yes "${SSH_USER}@${APP_HOST}" bash -s <<'ENDSSH'
          set -euo pipefail
          cd ~/bluelog
          docker compose -f docker-compose.prod.app.yml up -d backend </dev/null
          for i in $(seq 1 30); do
            if body=$(curl -fsS --max-time 5 http://127.0.0.1:8001/api/v1/health 2>/dev/null); then
              echo "[app-01] 헬스 OK (${i}회차) ${body}"
              exit 0
            fi
            sleep 5
          done
          echo "[app-01] 헬스 실패 — 150초" >&2
          exit 1
          ENDSSH

      # ------------------------------------------------------------------
      # collect — 공적 재항 기록 수집 (#1197)
      # ------------------------------------------------------------------
      - name: 공적 기록 수집 (app-01)
        if: inputs.task == 'collect'
        run: |
          ssh -i ~/.ssh/id_oci -o StrictHostKeyChecking=yes "${SSH_USER}@${APP_HOST}" bash -s <<'ENDSSH'
          set -euo pipefail
          cd ~/bluelog
          docker compose -f docker-compose.prod.app.yml exec -T backend python -m cii_platform.port_calls.collect </dev/null
          ENDSSH

      # ------------------------------------------------------------------
      # rollback-drill — 이전 이미지로 잠시 바꿨다가 되돌린다 (#789)
      # ------------------------------------------------------------------
      - name: 롤백 실습 사전 검사
        if: inputs.task == 'rollback-drill'
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          current=$(ssh -i ~/.ssh/id_oci -o StrictHostKeyChecking=yes "${SSH_USER}@${APP_HOST}" \
            "curl -fsS --max-time 5 http://127.0.0.1:8001/api/v1/health" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"].get("commit") or "")')
          echo "[drill] 지금 떠 있는 커밋 ${current:-알 수 없음} · 잠시 띄울 커밋 ${IMAGE_SHA}"
          if ! printf '%s' "${current}" | grep -Eq '^[0-9a-f]{12}$'; then
            echo "::error::헬스의 commit이 12자리 16진수가 아니다: ${current:-없음}"
            exit 1
          fi
          if [ "${current}" = "${IMAGE_SHA}" ]; then
            echo "::error::지금 커밋을 읽지 못했거나 대상과 같다"
            exit 1
          fi
          # 마이그레이션이 섞인 되돌림은 이 실습의 범위가 아니다 (OPERATIONS §3.6.3)
          if ! git diff --quiet "${IMAGE_SHA}" "${current}" -- alembic/; then
            echo "::error::두 커밋 사이에 alembic/ 변경이 있다 — 이미지만 되돌리면 스키마와 어긋난다"
            git diff --stat "${IMAGE_SHA}" "${current}" -- alembic/
            exit 1
          fi
          echo "CURRENT_SHA=${current}" >> "$GITHUB_ENV"

      - name: 롤백 실습 (app-01)
        if: inputs.task == 'rollback-drill'
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
          IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/bluelog-backend
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_oci -o StrictHostKeyChecking=yes "${SSH_USER}@${APP_HOST}" \
            "IMAGE_SHA='${IMAGE_SHA}' CURRENT_SHA='${CURRENT_SHA}' IMAGE_REPO='${IMAGE_REPO}' GHCR_USER='${GHCR_USER}' GHCR_TOKEN='${GHCR_TOKEN}' bash -s" <<'ENDSSH'
          set -euo pipefail
          cd ~/bluelog
          compose="docker compose -f docker-compose.prod.app.yml"

          wait_commit() {
            for i in $(seq 1 30); do
              got=$(curl -fsS --max-time 5 http://127.0.0.1:8001/api/v1/health 2>/dev/null \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["data"].get("commit") or "")' 2>/dev/null || true)
              if [ "${got}" = "$1" ]; then
                echo "[drill] 헬스 commit=${got} (${i}회차) $(date -u +%FT%TZ)"
                return 0
              fi
              sleep 5
            done
            echo "[drill] 헬스 commit이 $1 이 되지 않았다(마지막 ${got:-없음})" >&2
            return 1
          }

          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin
          cp -p .env .env.drill-orig
          # 무슨 일이 있어도 원래 이미지로 돌아간다
          # ssh가 끊겨도(러너 취소·네트워크) 복귀가 끝까지 가게 한다 — 끊김 신호(HUP)와 닫힌
          # 출력(PIPE)을 무시하고, 진행을 서버 파일 `~/bluelog/drill.log`에도 남긴다.
          # 복귀가 실패했으면 수동 복구: `cp .env.drill-orig .env && docker compose -f
          # docker-compose.prod.app.yml up -d backend` (OPERATIONS §3.8).
          log() { echo "$*" 2>/dev/null || true; echo "$(date -u +%FT%TZ) $*" >> ~/bluelog/drill.log; }
          restore() {
            trap '' HUP PIPE
            log "[drill] 원래 이미지로 복귀"
            cp -p .env.drill-orig .env
            ${compose} up -d backend </dev/null >/dev/null 2>&1 || { log "[drill] up -d 실패"; exit 1; }
            if wait_commit "${CURRENT_SHA}" >/dev/null 2>&1; then
              log "[drill] 복귀 완료 commit=${CURRENT_SHA}"
              rm -f .env.drill-orig
            else
              log "[drill] 복귀 헬스 실패 — 수동 복구 필요(.env.drill-orig 보존)"
              exit 1
            fi
          }
          trap restore EXIT

          echo "[drill] 교체 전 $(grep '^BACKEND_IMAGE=' .env)"
          sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${IMAGE_REPO}:${IMAGE_SHA}|" .env
          echo "[drill] 교체 후 $(grep '^BACKEND_IMAGE=' .env)"
          ${compose} pull backend </dev/null
          ${compose} up -d backend </dev/null
          wait_commit "${IMAGE_SHA}"
          echo "[drill] 이전 판이 떠 있다 — 30초 유지"
          sleep 30
          ENDSSH
