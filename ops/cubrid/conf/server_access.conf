# server_access.conf -- CUBRID 서버 레벨 ACL (4층 방어 중 4층).
#
# cubrid.conf에서 로드:
#   access_ip_control=yes
#   access_ip_control_file=/home/cubrid/CUBRID/conf/server_access.conf
#
# 형식 (CUBRID Administrator's Guide "Limiting Database Server Access"):
#   [@<dbname>]
#   <ip-or-prefix>
#
# 주의 -- 서버 ACL은 데이터베이스 단위이다. 사용자별 필터링은 broker_access.conf에서.
#
# CUBRID 아키텍처에서 클라이언트는 브로커에 접속하고, 브로커가 서버에 접속한다.
# 따라서 여기에는 브로커의 소스 IP를 적어야 한다.
# 분리 토폴로지에서 브로커와 서버는 같은 컨테이너(db-01)에 있으므로
# loopback(127.0.0.1) + Docker bridge(172.*)를 허용한다.
#
# 재로드 (재시작 불필요):
#   cubrid server acl reload cii

[@cii]
127.0.0.1
172.*
