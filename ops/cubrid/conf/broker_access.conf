# broker_access.conf -- CUBRID 브로커 레벨 ACL (4층 방어 중 3층).
#
# cubrid_broker.conf의 BROKER1 섹션에서 로드:
#   ACCESS_CONTROL      =ON
#   ACCESS_CONTROL_FILE =/home/cubrid/CUBRID/conf/broker_access.conf
#
# 형식 (CUBRID Administrator's Guide "Broker ACL"):
#   [%<BROKER_NAME>]
#   <dbname>:<dbuser>:<ip-or-prefix-list>
#
# 재로드 (재시작 불필요):
#   broker_changer BROKER1 access_control reload
#
# ----- BlueLog 프로덕션 규칙 -----
# REPLACE_ME_APP_PRIVATE_IP를 app-01 사설 IP로 바꿔야 한다.
# deploy 워크플로가 sed로 자동 치환한다.

[%BROKER1]
cii:dba:REPLACE_ME_APP_PRIVATE_IP
cii:public:REPLACE_ME_APP_PRIVATE_IP
