# cubrid.conf -- BlueLog(CII) 프로덕션 서버 설정 (db-01)
#
# docker-compose.prod.db.yml에서 read-only bind-mount된다.
# cubrid/cubrid:11.4 기본값에서 다음만 변경:
#   - 서버 레벨 ACL 활성화 (access_ip_control)
#   - 메모리 튜닝 (512M 컨테이너 메모리 한도에 맞춤)

[service]
service=server,broker,manager

[common]
# 메모리 튜닝 -- docker-compose.prod.db.yml의 512M 컨테이너 메모리 한도에 맞춤.
# data + log + (sort * max_clients)가 cgroup 한도 아래여야 한다.
data_buffer_size=128M
log_buffer_size=64M
sort_buffer_size=2M
max_clients=50

# CUBRID 기본 서버 포트 (클라이언트는 브로커 33000을 거쳐 접속한다).
cubrid_port_id=1523

# 볼륨 크기 (createdb 기본값).
db_volume_size=512M
log_volume_size=512M

# 0 = 이 배포가 둘 수 있는 가장 적은 보존 개수다(매뉴얼: 최솟값 0 · force_remove_log_archives=yes면
# 이 개수를 넘는 오래된 파일을 지운다). 그러나 일회용 컨테이너 실측(#1640, cubrid/cubrid:11.4 동일
# 이미지)으로는 보관 로그가 생성 즉시 지워지지 않았다. 대량 쓰기에서 보관 로그가 여러 개 쌓였고
# (실측 중 최대 7개 · 계속 늘던 중 중단), 서버는 생성 때 "exceeded max desired number of 0"만
# 남겼다(처음 셋에서 확인 · 이후는 같은 형태로 추정). 앞서 생긴 파일은 그 뒤의 대량 쓰기 도중에
# 조용히 사라졌다(삭제 메시지 없음 · 시점은 정황) — "0 = 무보존 보장"이 아니라 "지연된 정리"다.
# 보관 로그 하나는 활성 로그 볼륨 하나 크기다 — 실측(log_volume_size=20M)에서 20MiB였고, 이 배포는
# 512M라 하나에 512MB로 본다(512M 자체는 미실측).
# 복구는 보관 로그가 아니라 cubrid unloaddb 논리 덤프(scripts/db_backup.py · README 「백업·복구」)로
# 한다 — 보관 로그가 쌓여도 복구 절차는 바뀌지 않는다. 디스크 사용량은 OPERATIONS.md §8.4의
# du -sh로 관찰한다.
log_max_archives=0

# ----- 서버 레벨 ACL (4층 방어 중 4층) -----
# 활성화하면 인증 전에 server_access.conf의 IP/사용자 목록으로 검사한다.
# 빈 파일 = 전부 거부. 프로덕션 투입 전 반드시 server_access.conf를 채워야 한다.
#
# 런타임 재로드 (재시작 불필요):
#   cubrid server acl reload cii
access_ip_control=yes
access_ip_control_file=/home/cubrid/CUBRID/conf/server_access.conf
