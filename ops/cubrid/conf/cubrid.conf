# cubrid.conf -- BlueLog(CII) 프로덕션 서버 설정 (db-01)
#
# docker-compose.prod.db.yml에서 read-only bind-mount된다.
# cubrid/cubrid:11.4 기본값에서 다음만 변경:
#   - 서버 레벨 ACL 활성화 (access_ip_control)
#   - 메모리 튜닝 (512M 컨테이너 메모리 한도에 맞춤)

[service]
service=server,broker,manager

[common]
# 메모리 튜닝 -- docker-compose.prod.db.yml의 512M 컨테이너 메모리 한도에 맞춤.
# data + log + (sort * max_clients)가 cgroup 한도 아래여야 한다.
data_buffer_size=128M
log_buffer_size=64M
sort_buffer_size=2M
max_clients=50

# CUBRID 기본 서버 포트 (클라이언트는 브로커 33000을 거쳐 접속한다).
cubrid_port_id=1523

# 볼륨 크기 (createdb 기본값).
db_volume_size=512M
log_volume_size=512M

# 필요 없어진 보관 로그를 두지 않는다(원문은 0의 뜻을 명시하지 않는다 — 실측으로 확인).
# 이 배포의 복구 단위는 보관 로그가 아니라 논리 덤프다 (README 백업 절 · OPERATIONS.md §3.6.3 ·
# scripts/db_backup.py).
log_max_archives=0

# ----- 서버 레벨 ACL (4층 방어 중 4층) -----
# 활성화하면 인증 전에 server_access.conf의 IP/사용자 목록으로 검사한다.
# 빈 파일 = 전부 거부. 프로덕션 투입 전 반드시 server_access.conf를 채워야 한다.
#
# 런타임 재로드 (재시작 불필요):
#   cubrid server acl reload cii
access_ip_control=yes
access_ip_control_file=/home/cubrid/CUBRID/conf/server_access.conf
