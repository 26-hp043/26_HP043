# cubrid_broker.conf -- BlueLog(CII) 프로덕션 브로커 설정 (db-01)
#
# docker-compose.prod.db.yml에서 read-only bind-mount된다.
# cubrid/cubrid:11.4 기본값에서 다음만 변경:
#   - query_editor 비활성화 (관리 도구, 프로덕션 불필요)
#   - BROKER1 ACL 활성화

[broker]
MASTER_SHM_ID           =30001
ADMIN_LOG_FILE          =log/broker/cubrid_broker.log

# ----- query_editor: CUBRID Manager 웹 도구 -----
# 프로덕션에서 비활성화. 호스트 밖으로 노출되지 않으며 CAS 프로세스 5개가 낭비된다.
[%query_editor]
SERVICE                 =OFF
SSL                     =OFF
BROKER_PORT             =30000
MIN_NUM_APPL_SERVER     =5
MAX_NUM_APPL_SERVER     =40
APPL_SERVER_SHM_ID      =30000
LOG_DIR                 =log/broker/sql_log
ERROR_LOG_DIR           =log/broker/error_log
SQL_LOG                 =ON
TIME_TO_KILL            =120
SESSION_TIMEOUT         =300
KEEP_CONNECTION         =AUTO
CCI_DEFAULT_AUTOCOMMIT  =ON

# ----- BROKER1: BlueLog 백엔드가 접속하는 브로커 (포트 33000) -----
# ACCESS_CONTROL=ON으로 브로커 레벨 ACL을 활성화한다 (4층 방어 중 3층).
# broker_access.conf가 비거나 없으면 전부 거부된다.
#
# 런타임 재로드 (재시작 불필요):
#   broker_changer BROKER1 access_control reload
[%BROKER1]
SERVICE                 =ON
SSL                     =OFF
BROKER_PORT             =33000
MIN_NUM_APPL_SERVER     =5
MAX_NUM_APPL_SERVER     =40
APPL_SERVER_SHM_ID      =33000
LOG_DIR                 =log/broker/sql_log
ERROR_LOG_DIR           =log/broker/error_log
SQL_LOG                 =ON
TIME_TO_KILL            =120
SESSION_TIMEOUT         =300
KEEP_CONNECTION         =AUTO
CCI_DEFAULT_AUTOCOMMIT  =ON
ACCESS_CONTROL          =ON
ACCESS_CONTROL_FILE     =/home/cubrid/CUBRID/conf/broker_access.conf
