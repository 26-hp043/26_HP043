# docker-compose.prod.db.yml -- DB 호스트 (db-01) OCI 분리 토폴로지.
#
# our-tax ADR-0005 패턴을 따른다. 프로덕션 스택은 두 VM에 걸쳐 운영된다:
#   - db-01: 이 파일 (CUBRID, DB명 cii)
#   - app-01: docker-compose.prod.app.yml (backend + migrate)
#
# 사용법 (db-01):
#   cp .env.db.example .env
#   # .env 편집 (CUBRID_PASSWORD · OCI_DB_PRIVATE_IP 설정)
#   docker compose -f docker-compose.prod.db.yml up -d
#
# 크로스 VM 접근은 4층 방어로 제한한다 (our-tax #86 패턴):
#   1. OCI Security List   -- app-01 사설 IP /32만 :33100 허용
#   2. 바인드 주소          -- 게시를 db-01 사설 IP에만 붙인다 (아래 ports · #1641)
#   3. CUBRID broker ACL   -- broker_access.conf
#   4. CUBRID server ACL   -- server_access.conf
#
# 2층이 ufw가 아닌 이유 (#1641): Docker가 publish한 포트로 오는 패킷은 DNAT 뒤
# FORWARD 체인(DOCKER-USER → DOCKER)으로 흐르고 호스트의 INPUT 체인을 거치지 않는다.
# 그래서 ufw INPUT 규칙은 이 포트에 관여하지 않는다 — 규칙이 있어도 막지 못하고,
# 없어도 열리지 않는다. 공용 인터페이스에 소켓이 아예 열리지 않게 하는 것이 2층이다.
#
# 층 3-4는 ops/cubrid/conf/에 정의되며 아래에서 bind-mount한다.
# 배포 전 ops/cubrid/conf/README.md의 치환 단계를 수행해
# REPLACE_ME_APP_PRIVATE_IP를 실제 app-01 사설 IP로 바꿔야 한다.

services:
  cubrid:
    image: cubrid/cubrid:11.4
    platform: linux/amd64
    container_name: cii-cubrid
    # CUBRID는 컨테이너 호스트명을 databases.txt에 기록한다. 고정하지 않으면
    # docker compose down && up 시 새 호스트명이 생기고, 브로커가
    # "Failed to connect to database server, 'cii', on <old-hostname>"으로 실패한다.
    #
    # 데이터는 아래 이름 있는 볼륨 `cubrid-data`가 **이미지의 데이터 경로**
    # (`VOLUME $CUBRID_DATABASES` = /home/cubrid/CUBRID/databases)에 붙어 지킨다(#1867).
    # 종전에는 `cubrid-data`가 엉뚱한 /var/lib/cubrid(비어 있다)에 붙어 실제 데이터가
    # 이미지가 만든 익명 볼륨에 쌓였고, `docker compose down`(-v 없이도) 뒤 `up`이
    # 새 익명 볼륨으로 빈 DB를 띄웠다(2026-09-24 로컬 실측). 옛 익명 볼륨에서
    # `cubrid-data`로 옮기는 한 번의 절차와 되돌리기는 docs/OPERATIONS.md §9.2.1.
    # `docker volume prune`은 쓰지 않는다 — 옮기기 전의 옛 익명 볼륨이 되돌릴 자리다.
    hostname: cii-cubrid
    restart: unless-stopped
    environment:
      CUBRID_DB: cii
      # NOTE: cubrid/cubrid:11.4 이미지는 첫 부트 시 CUBRID_PASSWORD를 적용하지 않는다.
      # dba 사용자는 빈 비밀번호로 생성된다. 브로커가 뜬 후
      # ALTER USER dba PASSWORD '...'로 설정해야 한다 (deploy 워크플로가 자동 처리).
      #
      # 🔴 그래도 이 값을 컨테이너에 넣는다 — **healthcheck가 읽는다**
      # (`#1058` 결정요청 §0-4). 비밀번호를 건 뒤에는 비밀번호 없는 healthcheck가
      # errno=-171로 실패하고, 컨테이너가 unhealthy가 되면 app-01이 붙을 DB를
      # 「준비되지 않음」으로 보게 된다.
      CUBRID_PASSWORD: ${CUBRID_PASSWORD:-}
    ports:
      # db-01 사설 IP에만 바인딩한다 (#1641). 종전 `"33100:33000"`은 모든 인터페이스에
      # 열렸고, 그 노출을 막는다던 ufw는 Docker가 publish한 포트에는 관여하지 않는다
      # (위 머리말). 값이 비면 `:33100:33000`이 되어 다시 모든 인터페이스로 열리므로
      # `:?`로 기동 자체를 멈춘다 — 비어서 열리는 것보다 비어서 안 뜨는 쪽이 낫다.
      # app-01은 이 사설 IP로 붙는다(deploy.yml `CUBRID_HOST`). 백업·정리 스크립트는
      # `docker compose exec`라 포트를 쓰지 않는다.
      # ourtax-cubrid가 33000을 사용하므로 호스트 33100으로 매핑한다.
      - "${OCI_DB_PRIVATE_IP:?OCI_DB_PRIVATE_IP가 비어 있다 -- 비면 모든 인터페이스에 열리므로 멈춘다 (#1641)}:33100:33000"
    volumes:
      # 이미지의 데이터 경로에 이름 있는 볼륨을 붙인다(#1867) — `down`·재생성 뒤에도 같은
      # 볼륨이다. ⚠️ 옛 익명 볼륨에 데이터가 있는 호스트에서 이 줄이 처음 적용되면 빈
      # `cubrid-data`가 그 데이터를 가린다 — 배포 DB 단계의 사전 검사가 그 경우 `up` 전에
      # 멈춘다(deploy.yml · OPERATIONS §9.2.1).
      - cubrid-data:/home/cubrid/CUBRID/databases
      # CUBRID 설정 -- 개별 파일을 read-only bind-mount한다.
      # 디렉토리 전체를 마운트하면 이미지가 기본 제공하는 SSL 인증서 등을 덮어쓴다.
      - ./ops/cubrid/conf/cubrid.conf:/home/cubrid/CUBRID/conf/cubrid.conf:ro
      - ./ops/cubrid/conf/cubrid_broker.conf:/home/cubrid/CUBRID/conf/cubrid_broker.conf:ro
      - ./ops/cubrid/conf/server_access.conf:/home/cubrid/CUBRID/conf/server_access.conf:ro
      - ./ops/cubrid/conf/broker_access.conf:/home/cubrid/CUBRID/conf/broker_access.conf:ro
    healthcheck:
      # `CMD`(exec 형식)는 셸을 거치지 않아 환경변수가 펼쳐지지 않는다 — `sh -c`로 감싼다.
      # 빈 값도 `-p ""`로 통과하므로(실측) 비밀번호를 걸기 전과 뒤가 같은 명령으로 돈다.
      test: ["CMD", "sh", "-c", 'csql -u dba -p "$$CUBRID_PASSWORD" "$$CUBRID_DB" -c "SELECT 1 FROM db_root"']
      interval: 30s
      timeout: 5s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  cubrid-data:
