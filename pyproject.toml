[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cii-platform"
version = "0.1.0"
requires-python = ">=3.12"
# 상한은 모든 런타임 의존성에 건다 (#235, TECH_SPEC §5.4 재현성 계약).
# numpy만 핀했던 기존 상태에선 같은 커밋이라도 실행 시점에 따라 다른 버전이 깔려
# 결과가 달라질 수 있었다. 버전은 2026-08-12 현재 설치된 값을 기준으로 — 상한은
# 다음 major가 깨지기 쉬운 패키지(fastapi · pydantic · starlette)에 맞춰 여유를 둔다.
dependencies = [
    "numpy==2.1.0",
    "sqlalchemy[asyncio]>=2.0.54,<2.1",
    # CUBRID 방언과 그 DBAPI. **둘은 한 벌이다.**
    #
    # `aiopycubrid`라는 배포본은 없다 — `cubrid+aiopycubrid`는 `sqlalchemy-cubrid`가
    # 싣는 **방언 이름**이고(`entry_points`의 `cubrid.aiopycubrid`), 그 방언은
    # `PyCubridDialect`를 상속해 `import pycubrid.aio`로 붙는다. 동기 쪽
    # (`cubrid+pycubrid`)은 같은 패키지의 `import pycubrid`다. 어느 길이든 DBAPI는
    # **pycubrid 하나**이며, 이 앱은 `create_async_engine`으로 도므로 aio 쪽을 탄다.
    #
    # 🔴 **하한이 `>=1.2.0`이면 안 된다** — 업스트림이 async 방언에 요구하는 값은
    # `pycubrid>=1.3.2`다(`sqlalchemy-cubrid`의 `[pycubrid]` extra · README FAQ).
    # 낮게 두면 새로 푸는 환경이 1.2.x를 집어 `import pycubrid.aio`에서 죽는데,
    # `uv.lock`이 1.7.1을 물고 있어 **지금 환경에서는 드러나지 않는다.**
    #
    # `sqlalchemy-cubrid[pycubrid]` extra로 받는 길도 있으나 **이름을 직접 적는 쪽**을
    # 고른다 — `depcheck`(#523)가 기동 전에 대조하는 것은 여기 적힌 이름이고,
    # extra 안으로 숨기면 「방언은 있는데 드라이버가 없는」 이미지를 잡지 못한다.
    "sqlalchemy-cubrid>=1.3.0,<2.0",
    "pycubrid>=1.3.2,<2.0",
    # `asyncpg`는 빼 둔다 — 이 브랜치는 CUBRID로 붙는다 (`#1058`).
    # `alembic` 하한은 **`main` 쪽을 따른다** — 봇 PR `#1137`이 1.20.0으로 올렸다.
    # 낮은 하한을 고집할 이유가 없고, 고집하면 머지마다 같은 충돌이 되돌아온다.
    "alembic>=1.20.0,<2.0",
    "fastapi>=0.141.1,<0.150",
    "uvicorn[standard]>=0.53.0,<0.60",
    "httpx>=0.28.1,<0.29",
    # `#1664` — 보고서·내보내기가 `ZoneInfo("Asia/Seoul")`을 쓴다(`services/report.py` ·
    # `services/data_export.py`). Linux 이미지는 OS의 `/usr/share/zoneinfo`로 풀리지만
    # **Windows에는 OS 시간대 데이터가 없어** 새 가상환경에서 `ZoneInfoNotFoundError`가
    # 난다. `zoneinfo`는 OS 데이터가 없을 때만 이 패키지를 보므로 Linux 동작은 그대로다.
    "tzdata>=2025.2",
    "pyjwt[crypto]>=2.14.0,<3.0",
    # 인증 메일 발송 (#407). console 백엔드만 쓰는 개발 환경에서는 import되지 않는다.
    "aiosmtplib>=5.1.3,<6.0",
    # 비밀번호 해싱 (#414). Argon2id — bcrypt의 72바이트 절단·PBKDF2의 GPU 취약을 피한다.
    "argon2-cffi>=25.1.0,<26",
    # `auth/password.py`가 해싱을 스레드로 내보낼 때 직접 쓴다 (#827). starlette가
    # 이미 끌어오지만 **직접 import하므로 직접 적는다** — 상위 패키지가 의존을 바꾸면
    # 적지 않은 쪽이 조용히 깨진다. `starlette.concurrency.run_in_threadpool`이 아닌
    # 이유는 그쪽이 `limiter`를 받지 않아 전용 동시 실행 한도를 걸 수 없어서다.
    "anyio>=4.15.1,<5",
    # 리포트 PDF 렌더링 (#361). 순수 Python 패키지지만 **런타임에 Pango가 필요**하다
    # (Dockerfile의 libpango-1.0-0 · libpangoft2-1.0-0). 그래서 reports/pdf.py가
    # 지연 import 한다 — 최상단에서 import하면 라이브러리가 없는 환경에서 앱 전체가
    # 뜨지 않고 CSV 내보내기까지 막힌다.
    "weasyprint>=70.0,<71",
    # CSV 가져오기의 multipart/form-data 파싱 (#60). FastAPI가 `UploadFile`·`Form`을
    # 쓰는 라우트를 **등록하는 시점에** 이 패키지를 요구한다 — 없으면 요청이 아니라
    # 앱 기동이 실패하므로 선택 의존성으로 둘 수 없다 (`API_SPEC §8.2`).
    "python-multipart>=0.0.20,<0.1",
    "searoute>=1.6.0,<2.0",
]

[project.optional-dependencies]
# ruff 버전의 **유일한 출처**다 — CI의 lint 잡이 이 핀을 읽어 설치한다 (#235 · #478).
# 여기만 고치면 로컬과 CI가 함께 따라온다. `ci.yml`에 버전을 적지 않는다.
# pytest 계열은 마이너 버전 사이에서 큰 변화가 없어 상한만 둔다.
dev = [
    "ruff==0.16.8",
    "pytest>=9.1.1,<10.0",
    "pytest-asyncio>=1.4.0,<2.0",
    "pytest-cov>=7.1.0,<8.0",
    # PDF 텍스트 추출 (#361). 한글이 tofu로 렌더링되면 바이트 길이·HTTP 상태는
    # 정상이라 **추출된 텍스트로만** 잡을 수 있다.
    "pypdf>=6.19.0,<7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cii_platform"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TID251"]

[tool.ruff.lint.per-file-ignores]
# UT-RNG-004 (TEST_PLAN §2.4 [ORACLE-M-1]) 가 default_rng()를 런타임 canary로 직접
# 호출해야 한다. 정적 lint로 프로덕션 코드의 default_rng 사용을 차단하되, canary
# 테스트만 이 규칙에서 제외한다.
"tests/test_rng_reproducibility.py" = ["TID251"]

# `#1915` — 이 둘은 **운영 호스트의 python3**(Ubuntu 22.04 · 3.10)에서 돈다.
# ruff는 `requires-python`(>=3.12)에서 대상 버전을 추론해 `UP017`
# (`timezone.utc` → `datetime.UTC`)을 건다. 그 지적을 따르면 **호스트에서 ImportError로
# 죽는다** — `datetime.UTC`는 3.11+다. 패키지와 실행 환경이 다른 파일이라 규칙에서 뺀다.
#
# 이 두 줄이 「구식 코드를 봐준다」가 아니라 **실행 환경이 다르다**는 뜻임을
# `tests/test_ops_scripts_host_python.py`가 문법·이름·의존 셋으로 잠근다.
"scripts/db_backup.py" = ["UP017"]
"scripts/purge_expired.py" = ["UP017"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"numpy.random.default_rng".msg = "Use np.random.Generator(np.random.PCG64DXSM(seed)) explicitly — 재현성 계약(TECH_SPEC §2.5.1, UT-RNG-004)."

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# ── 커버리지 (#871) ──────────────────────────────────────────────────────────
#
# `concurrency`를 지정하지 않으면 **HTTP 테스트가 지나간 라우트 본문이 미실행으로
# 집계된다.** 종전에는 이 설정 자체가 없었다.
#
# 두 겹이 겹쳐 있기 때문이다.
#
#   1. `TestClient`는 ASGI 앱을 **워커 스레드**의 blocking portal에서 돌린다.
#   2. 그 안에서 SQLAlchemy asyncio가 **greenlet**으로 스택을 전환한다.
#
# 하나만 켜면 다른 하나에서 추적을 잃는다. `test_auth_api.py`의 409 검사 한 건으로
# 실측한 값이다 — `thread` 41% · `greenlet` 31% · **둘 다 50%**.
#
# ⚠️ **집계가 낮게 나오던 것이지 코드가 안 돌던 것이 아니다.** 그 검사는 라우트가
# 만드는 문구(`EMAIL_TAKEN_MESSAGE`)를 단언하므로 본문은 반드시 실행됐다. `#871`이
# 「본문 미실행」으로 본 것이 이 계측 문제였다.
[tool.coverage.run]
concurrency = ["thread", "greenlet"]
