[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cii-platform"
version = "0.1.0"
requires-python = ">=3.12"
# 상한은 모든 런타임 의존성에 건다 (#235, TECH_SPEC §5.4 재현성 계약).
# numpy만 핀했던 기존 상태에선 같은 커밋이라도 실행 시점에 따라 다른 버전이 깔려
# 결과가 달라질 수 있었다. 버전은 2026-08-12 현재 설치된 값을 기준으로 — 상한은
# 다음 major가 깨지기 쉬운 패키지(fastapi · pydantic · starlette)에 맞춰 여유를 둔다.
dependencies = [
    "numpy==2.1.0",
    "sqlalchemy[asyncio]>=2.0.52,<2.1",
    "asyncpg>=0.30,<0.32",
    "alembic>=1.19.1,<2.0",
    "fastapi>=0.141.1,<0.150",
    "uvicorn[standard]>=0.52.1,<0.60",
    "httpx>=0.28.1,<0.29",
    "pyjwt[crypto]>=2.8,<3.0",
    # 인증 메일 발송 (#407). console 백엔드만 쓰는 개발 환경에서는 import되지 않는다.
    "aiosmtplib>=3.0,<5.0",
    # 비밀번호 해싱 (#414). Argon2id — bcrypt의 72바이트 절단·PBKDF2의 GPU 취약을 피한다.
    "argon2-cffi>=25.1.0,<26",
    # 리포트 PDF 렌더링 (#361). 순수 Python 패키지지만 **런타임에 Pango가 필요**하다
    # (Dockerfile의 libpango-1.0-0 · libpangoft2-1.0-0). 그래서 reports/pdf.py가
    # 지연 import 한다 — 최상단에서 import하면 라이브러리가 없는 환경에서 앱 전체가
    # 뜨지 않고 CSV 내보내기까지 막힌다.
    "weasyprint>=66,<70",
]

[project.optional-dependencies]
# ruff를 CI(ci.yml ==0.16.2)와 같은 버전으로 핀 — 로컬/CI lint 결과가 갈라지는 것을 막는다 (#235).
# pytest 계열은 마이너 버전 사이에서 큰 변화가 없어 상한만 둔다.
dev = [
    "ruff==0.16.2",
    "pytest>=9.1.1,<10.0",
    "pytest-asyncio>=1.4.0,<2.0",
    "pytest-cov>=7.1.0,<8.0",
    # PDF 텍스트 추출 (#361). 한글이 tofu로 렌더링되면 바이트 길이·HTTP 상태는
    # 정상이라 **추출된 텍스트로만** 잡을 수 있다.
    "pypdf>=5.0,<7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cii_platform"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TID251"]

[tool.ruff.lint.per-file-ignores]
# UT-RNG-004 (TEST_PLAN §2.4 [ORACLE-M-1]) 가 default_rng()를 런타임 canary로 직접
# 호출해야 한다. 정적 lint로 프로덕션 코드의 default_rng 사용을 차단하되, canary
# 테스트만 이 규칙에서 제외한다.
"tests/test_rng_reproducibility.py" = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"numpy.random.default_rng".msg = "Use np.random.Generator(np.random.PCG64DXSM(seed)) explicitly — 재현성 계약(TECH_SPEC §2.5.1, UT-RNG-004)."

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
