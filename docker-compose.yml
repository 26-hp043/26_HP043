services:
  db:
    image: cubrid/cubrid:11.4
    platform: linux/amd64
    container_name: cii-cubrid
    hostname: cii-cubrid
    environment:
      CUBRID_DB: ${CUBRID_DB:-cii}
    ports: ["33100:33000"]
    volumes: [cubrid-data:/var/lib/cubrid]
    healthcheck:
      test: ["CMD", "sh", "-c", "csql -u dba ${CUBRID_DB:-cii} -c 'SELECT 1 FROM db_root'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  app:
    build:
      context: .
      target: dev
    image: bluelog-app-dev
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: cubrid+aiopycubrid://dba:@db:33000/${CUBRID_DB:-cii}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./tests:/app/tests:ro
      - ./scripts:/app/scripts:ro
volumes:
  cubrid-data:
