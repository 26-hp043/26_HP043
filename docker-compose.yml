services:
  db:
    image: postgres:16-alpine
    environment:
      # credential은 환경변수로 주입한다 (#85). .env 파일 또는 셸 환경에서 설정.
      POSTGRES_USER: ${POSTGRES_USER:-cii}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cii}
      POSTGRES_DB: ${POSTGRES_DB:-cii}
      # DB_SCHEMA §0.1 [X-6]: 모든 TIMESTAMPTZ는 UTC 기준, 서버 timezone=UTC 설정 필수
      TZ: UTC
      PGTZ: UTC
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cii}"]
      interval: 5s
      retries: 5
  app:
    build:
      context: .
      # 멀티스테이지 Dockerfile의 dev stage 사용 (--reload, editable install) (#85)
      target: dev
    #
    # 이미지 이름을 명시한다 (#477).
    #
    # 종전에는 양쪽 compose가 `image:`를 지정하지 않아 **둘 다 `26_hp043-app`** 이 됐다.
    # `docker compose -f docker-compose.prod.yml build`(README 배포 절차 2단계)를 한 번
    # 돌리면 그 태그가 prod 이미지로 덮이고, 이후 개발용 `up`이 **prod 이미지로 뜬다.**
    # prod는 비-editable 설치라 아래 소스 마운트가 무력화되는데 — 오류가 나지 않고
    # **소스 수정이 조용히 무시된다.**
    #
    image: bluelog-app-dev
    ports: ["8000:8000"]
    #
    # `.env`를 컨테이너에 **주입**한다 (#508).
    #
    # compose가 `.env`를 읽는 것은 이 파일 안의 `${POSTGRES_USER}` 같은 **치환용**이지
    # 컨테이너 주입이 아니다. 그래서 종전에는 `DATABASE_URL` 하나만 들어가고
    # `MAIL_BACKEND`·`APP_PUBLIC_URL`·`APP_ENV`가 전부 비어 있었다 —
    # `mail/config.py`의 기본값 `console`이 적용되어 **메일이 조용히 로그로만 나갔고**,
    # `#429`가 고친 메일 링크 주소도 이 경로에서는 무효였다.
    #
    # `required: false` — `.env`는 gitignore 대상이라 CI·새 클론에는 없다. 없으면
    # 건너뛴다.
    #
    env_file:
      - path: .env
        required: false
    environment:
      #
      # `environment:`가 `env_file:`보다 **우선한다.** 이 순서가 중요하다 —
      # `.env`의 `DATABASE_URL`은 호스트에서 `uvicorn --env-file .env`로 띄울 때 쓰는
      # `localhost:5432`인데, 컨테이너 안에서 그 주소는 컨테이너 자신을 가리킨다.
      # 여기서 `db:5432`로 덮어써야 한다.
      #
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cii}:${POSTGRES_PASSWORD:-cii}@db:5432/${POSTGRES_DB:-cii}
    depends_on:
      db:
        condition: service_healthy
    #
    # dev 전용 마운트. 컨테이너를 다시 빌드하지 않아도 호스트의 변경이 반영된다.
    #
    # **단, 이미지가 dev stage로 빌드돼 있어야 한다** — editable 설치라 import가
    # `/app/src`를 향하기 때문이다. prod 이미지로 뜨면 import가 site-packages를 향해
    # 이 마운트가 아무 일도 하지 않는다(위 `image:` 주석 참조 · #477).
    #
    # `alembic.ini`·`alembic/`을 함께 마운트하는 이유 (#477): 마이그레이션은 자주
    # 추가되는데 Dockerfile COPY로 넣으면 그때마다 재빌드가 필요하다. prod stage는
    # 이미지가 스스로 서야 하므로 COPY가 맞고, dev는 마운트가 맞다.
    #
    # `pyproject.toml`도 마운트한다 (#523).
    #
    # 소스만 마운트하면 **의존성이 반영되지 않는다.** dev 이미지는 빌드 시점에
    # `pip install -e .`로 패키지를 굳히므로, 의존성이 추가된 커밋을 pull해도
    # 이미지는 그대로다. 실제로 `#60`이 `python-multipart`를 추가한 뒤 재빌드하지
    # 않은 환경에서 **앱이 기동조차 못 했다.**
    #
    # 이 마운트 자체가 의존성을 설치하지는 않는다. `depcheck`가 **호스트의 현재
    # pyproject**와 이미지에 설치된 것을 대조하기 위한 것이다 — 마운트하지 않으면
    # 이미지 안의 낡은 사본끼리 비교해 늘 통과한다.
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./pyproject.toml:/app/pyproject.toml:ro
volumes:
  pgdata: