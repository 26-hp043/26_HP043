services:
  db:
    image: cubrid/cubrid:11.4
    platform: linux/amd64
    container_name: cii-cubrid
    hostname: cii-cubrid
    environment:
      CUBRID_DB: ${CUBRID_DB:-cii}
      # prod와 같은 모양으로 둔다 — 개발 스택은 비밀번호가 없지만, 두 파일이 다르면
      # 「prod에서만 깨지는 healthcheck」가 다시 생긴다 (`#1058` 결정요청 §0-4).
      CUBRID_PASSWORD: ${CUBRID_PASSWORD:-}
    ports: ["33100:33000"]
    volumes: [cubrid-data:/var/lib/cubrid]
    healthcheck:
      test: ["CMD", "sh", "-c", 'csql -u dba -p "$$CUBRID_PASSWORD" "$$CUBRID_DB" -c "SELECT 1 FROM db_root"']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  app:
    build:
      context: .
      target: dev
    image: bluelog-app-dev
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: cubrid+aiopycubrid://dba:@db:33000/${CUBRID_DB:-cii}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./tests:/app/tests:ro
      - ./scripts:/app/scripts:ro
      - ./API_SPEC.md:/app/API_SPEC.md:ro
      - ./PRD.md:/app/PRD.md:ro
      - ./DB_SCHEMA.md:/app/DB_SCHEMA.md:ro
      - ./TECH_SPEC.md:/app/TECH_SPEC.md:ro
      - ./DESIGN_SYSTEM.md:/app/DESIGN_SYSTEM.md:ro
      # UIFLOW는 `tests/test_doc_cross_refs.py`의 `TARGETS` 첫 항목이다 (`#1207`).
      # 빠뜨리면 컨테이너 안에서 그 가드가 「파일 없음」으로 죽는다 — 가드가 태어난
      # 이유 자체가 「DESIGN_SYSTEM이 존재한 적 없는 UIFLOW 절을 6종 참조한다」였다.
      - ./UIFLOW.md:/app/UIFLOW.md:ro
      - ./AGENTS.md:/app/AGENTS.md:ro
      - ./TEST_PLAN.md:/app/TEST_PLAN.md:ro
      - ./README.md:/app/README.md:ro
volumes:
  cubrid-data:
