# 프론트엔드 서빙 + /api 리버스 프록시 (#240)
#
# 이 파일이 「같은 오리진」 전제를 성립시킨다. apiProvider.ts의 기본 base URL이
# 상대 경로 `/api/v1`이므로, 브라우저는 화면을 받은 것과 같은 오리진으로 API를
# 부른다 — 그래서 백엔드에 CORSMiddleware가 필요 없다.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 프록시가 먼저 매칭되어야 한다. location / 의 SPA fallback이 위에 있으면
    # /api/... 요청까지 index.html로 떨어진다.
    location /api/ {
        proxy_pass http://app:8000;

        # 세션 쿠키·CSRF 헤더가 그대로 전달되어야 한다 (auth/session.ts).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # rate_limit이 신뢰하는 헤더다. 프록시가 값을 **덮어써야** 클라이언트가
        # 임의로 넣은 X-Forwarded-For로 한도를 우회할 수 없다 (PR #281).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    # SPA fallback — 새로고침·직접 URL 진입에서 404가 나지 않게 한다.
    # screens.ts의 계층 라우팅(/vessels/:id/voyages/:voyageId, #348)이 클라이언트
    # 라우터에 있으므로 서버는 어떤 경로든 index.html을 돌려줘야 한다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시가 박힌 자산은 내용이 바뀌면 파일명이 바뀐다 — 길게 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html은 캐시하지 않는다. 캐시되면 새 배포 후에도 옛 자산 해시를 가리킨다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
